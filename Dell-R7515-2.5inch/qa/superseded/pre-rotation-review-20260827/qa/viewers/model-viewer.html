<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>R7515 model-viewer QA</title>
  <link rel="icon" href="data:,">
  <script type="module" src="https://unpkg.com/@google/model-viewer@4.3.1/dist/model-viewer.min.js"></script>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #e7e7e7; color: #171717; }
    header { height: 88px; display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; background: #fff; border-bottom: 1px solid #aaa; }
    h1 { margin: 0; font-size: 24px; }
    #status { font: 600 15px/1.4 ui-monospace, monospace; text-align: right; }
    main { height: calc(100vh - 88px); padding: 20px; }
    .checker { width: 100%; height: 100%; border: 1px solid #8d8d8d; background-color: #d7d7d7; background-image: linear-gradient(45deg,#eee 25%,transparent 25%),linear-gradient(-45deg,#eee 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#eee 75%),linear-gradient(-45deg,transparent 75%,#eee 75%); background-size: 32px 32px; background-position: 0 0,0 16px,16px -16px,-16px 0; }
    model-viewer { width: 100%; height: 100%; background: transparent; --poster-color: transparent; }
  </style>
</head>
<body>
  <header>
    <h1>Dell PowerEdge R7515 — model-viewer 4.3.1</h1>
    <div id="status">initializing</div>
  </header>
  <main><div class="checker"><model-viewer id="viewer" interaction-prompt="none" field-of-view="30deg" min-field-of-view="30deg" max-field-of-view="30deg" exposure="1" shadow-intensity="0" environment-image="neutral" tone-mapping="neutral"></model-viewer></div></main>
  <script>
    const params = new URLSearchParams(location.search);
    const modelKey = params.get('model') === 'web' ? 'web' : 'standard';
    const viewKey = params.get('view') || 'front';
    const run = params.get('run') || 'manual';
    const models = {
      standard: '../../model/Dell-R7515-2.5inch.glb',
      web: '../../model/Dell-R7515-2.5inch-web.glb'
    };
    const orbits = {
      front: '0deg 90deg 0.95m', rear: '180deg 90deg 0.95m',
      right: '90deg 90deg 1.45m', left: '-90deg 90deg 1.45m',
      top: '0deg 0.01deg 1.45m', bottom: '0deg 179.99deg 1.45m',
      'front-right': '45deg 70deg 1.55m', 'front-left': '-45deg 70deg 1.55m',
      'rear-right': '135deg 70deg 1.55m', 'rear-left': '-135deg 70deg 1.55m'
    };
    const viewer = document.querySelector('#viewer');
    const status = document.querySelector('#status');
    viewer.setAttribute('camera-orbit', orbits[viewKey] || orbits.front);
    viewer.setAttribute('src', models[modelKey]);
    viewer.addEventListener('error', (event) => {
      status.textContent = `ERROR ${modelKey} ${viewKey}`;
      window.__qa = { ready: false, error: String(event.detail?.type || event.type), viewer: 'model-viewer-4.3.1', model: modelKey, view: viewKey, run };
    });
    viewer.addEventListener('load', () => {
      viewer.jumpCameraToGoal();
      requestAnimationFrame(() => requestAnimationFrame(() => setTimeout(() => {
        const shadow = viewer.shadowRoot;
        const canvases = shadow ? shadow.querySelectorAll('canvas').length : 0;
        const orbit = viewer.getCameraOrbit();
        window.__qa = {
          ready: true,
          viewer: 'model-viewer-4.3.1',
          rendererPath: 'google-model-viewer-webgl',
          model: modelKey,
          modelUrl: models[modelKey],
          view: viewKey,
          run,
          canvasCount: canvases,
          modelIsVisible: viewer.modelIsVisible,
          cameraOrbitRadians: { theta: orbit.theta, phi: orbit.phi, radius: orbit.radius },
          loadedAt: new Date().toISOString()
        };
        status.textContent = `LOADED · ${modelKey} · ${viewKey} · canvas ${canvases}`;
      }, 350)));
    }, { once: true });
  </script>
</body>
</html>
