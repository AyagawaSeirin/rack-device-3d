    - generic [ref=e153]:
      - main [ref=e154]:
        - button "Chapter Contents" [ref=e156] [cursor=pointer]
        - generic [ref=e158]:
          - navigation [ref=e159]:
            - list [ref=e160]:
              - listitem [ref=e161]:
                - link "Overview" [ref=e162] [cursor=pointer]:
                  - /url: "#id_22500"
          - article [ref=e163]:
            - heading "Overview" [level=2] [ref=e164]
            - generic [ref=e165]:
              - paragraph [ref=e166]: "The Cisco N9K-C93180YC-EX switch is a 1-RU, fixed-port switch designed for Top-of-Rack (TOR), Middle-of-Rack (MoR), and End-of-Rack (EoR) deployment in data centers. This switch has 48 10/25-Gigabit SFP+ downlink ports that support 1-Gigabit, 10-Gigabit, and 25-Gigabit Ethernet, and it has six fixed 40/100-Gigabit QSFP28 uplink ports that support combinations of 10-, 25-, 40-, 50-, and 100-Gigabit connectivity. You can set the downlink port speeds on a port-by-port basis. The chassis for this switch includes the following user-replaceable components:"
              - note [ref=e168]:
                - rowgroup [ref=e169]:
                  - row [ref=e170]:
                    - heading [ref=e171]:
                      - paragraph [ref=e173]: Note
                    - cell [ref=e174]:
                      - generic [ref=e175]:
                        - separator [ref=e176]
                        - paragraph [ref=e177]: You can order this switch in a 24-port configuration (N9K-C93180YC-EX-24)
                        - separator [ref=e178]
              - list [ref=e179]:
                - listitem [ref=e180]:
                  - paragraph [ref=e181]: "Fan modules (four) with the following airflow choices:"
                  - list [ref=e182]:
                    - listitem [ref=e183]:
                      - paragraph [ref=e184]: Port-side intake airflow with burgundy coloring (NXA-FAN-30CFM-B)
                    - listitem [ref=e185]:
                      - paragraph [ref=e186]: Port-side exhaust airflow with blue coloring (NXA-FAN-30CFM-F)
                      - note [ref=e187]:
                        - rowgroup [ref=e188]:
                          - row [ref=e189]:
                            - heading [ref=e190]:
                              - paragraph [ref=e192]: Note
                            - cell [ref=e193]:
                              - generic [ref=e194]:
                                - separator [ref=e195]
                                - paragraph [ref=e196]: Each fan module has two rotors. The switch can function normally if one rotor inside the any one fan module fails. In case of more than one rotor failure, the switch will issue a warning and power down in 2 minute.
                                - separator [ref=e197]
                - listitem [ref=e198]:
                  - paragraph [ref=e199]: "Power supply modules (two—One for operations and one for redundancy [1+1]) with the following choices:"
                  - list [ref=e200]:
                    - listitem [ref=e201]:
                      - paragraph [ref=e202]: 650-W AC power supply with port-side intake airflow (burgundy coloring) (NXA-PAC-650W-PI)
                    - listitem [ref=e203]:
                      - paragraph [ref=e204]: 650-W AC power supply with port-side exhaust airflow (blue coloring) (NXA-PAC-650W-PE)
                    - listitem [ref=e205]:
                      - paragraph [ref=e206]: 1200-W HVAC/HVDC power supply with dual-direction airflow (white coloring) (N9K-PUV-1200W)
                    - listitem [ref=e207]:
                      - paragraph [ref=e208]: 930-W DC power supply with port-side exhaust airflow (gray coloring) (UCS-PSU-6332-DC)
                    - listitem [ref=e209]:
                      - paragraph [ref=e210]: 930-W DC power supply with port-side intake airflow (green coloring) (UCSC-PSU-930WDC)
                    - listitem [ref=e211]:
                      - paragraph [ref=e212]: 930-W DC power supply with port-side intake airflow (burgundy coloring) (NXA-PDC-930W-PI)
                    - listitem [ref=e213]:
                      - paragraph [ref=e214]: 930-W DC power supply with port-side exhaust airflow (blue coloring) (NXA-PDC-930W-PE)
                  - note [ref=e215]:
                    - rowgroup [ref=e216]:
                      - row [ref=e217]:
                        - heading [ref=e218]:
                          - paragraph [ref=e220]: Note
                        - cell [ref=e221]:
                          - generic [ref=e222]:
                            - separator [ref=e223]
                            - paragraph [ref=e224]: Both power supplies must be the same type. Do not mix AC, DC, or HVAC/HVDC power supplies.
                            - separator [ref=e225]
                  - note [ref=e226]:
                    - rowgroup [ref=e227]:
                      - row [ref=e228]:
                        - heading [ref=e229]:
                          - paragraph [ref=e231]: Note
                        - cell [ref=e232]:
                          - generic [ref=e233]:
                            - separator [ref=e234]
                            - paragraph [ref=e235]: All fan modules and power supplies must use the same airflow direction during operations. If you are using the 1200-W HVAC/HVDC power supply, the power supply automatically uses the same airflow direction as used by the other modules in the switch.
                            - separator [ref=e236]
              - paragraph [ref=e237]:
                - strong [ref=e238]: Deployment Scheme for SFP-10G-T-X Transceivers
              - paragraph [ref=e239]: The following figure shows the maximum configuration density of SFP-10G-T-X SFP+ transceivers for this switch.
              - link "Related image, diagram or screenshot." [ref=e240] [cursor=pointer]:
                - /url: https://www.cisco.com/c/dam/en/us/td/i/500001-600000/500001-510000/503001-504000/503038.jpg
              - table [ref=e243]:
                - caption
                - rowgroup [ref=e247]:
                  - row [ref=e248]:
                    - cell [ref=e249]:
                      - link "Related image, diagram or screenshot." [ref=e250] [cursor=pointer]:
                        - /url: https://www.cisco.com/c/dam/en/us/td/i/500001-600000/500001-510000/504001-505000/504774.jpg
                    - cell [ref=e252]:
                      - paragraph [ref=e253]: Active port deploying the SFP+ 10GBASE-T transceiver, with max power consumption up to 2.5W.
                      - paragraph [ref=e254]: Once configured with “media-type 10g-tx” in NX-OS or “Link Level Policy -> Physical Media Type -> SFP 10G TX” in ACI, these ports can deploy SFP-10G-T-X. Without such configuration, they behave like normal ports.
                  - row [ref=e255]:
                    - cell [ref=e256]:
                      - link "Related image, diagram or screenshot." [ref=e257] [cursor=pointer]:
                        - /url: https://www.cisco.com/c/dam/en/us/td/i/500001-600000/500001-510000/504001-505000/504775.jpg
                    - cell [ref=e259]:
                      - paragraph [ref=e260]: Port must either be empty or active with passive copper cables only (Max. power consumption up to 0.1W).
                      - paragraph [ref=e261]: Once 10g-tx is configured on yellow ports, ports to the left, right, top and bottom of the yellow port are referenced as blue ports. These adjacent ports will then support only low power Passive Copper DAC cable, or these can be left empty to conserve power. If 10g-tx configuration is removed from adjacent yellow ports, the blue ports will revert to behaving like normal ports.
                  - row [ref=e262]:
                    - cell [ref=e263]:
                      - link "Related image, diagram or screenshot." [ref=e264] [cursor=pointer]:
                        - /url: https://www.cisco.com/c/dam/en/us/td/i/500001-600000/500001-510000/504001-505000/504776.jpg
                    - cell [ref=e266]:
                      - paragraph [ref=e267]: Active Port deploying any Cisco 1/10/25G optics (SFP, SFP+, SFP28) EXCLUDING SFP+ 10GBASE-T, with max power consumption up to 1.5W. These ports are not part of any scheme and can deploy all regular Cisco optics and behave like normal ports.
              - paragraph [ref=e268]: The following figure shows the hardware features seen from the port side of the chassis.
              - figure [ref=e269]:
                - link "Related image, diagram or screenshot." [ref=e270] [cursor=pointer]:
                  - /url: https://www.cisco.com/c/dam/en/us/td/i/500001-600000/500001-510000/500001-501000/500695.jpg
              - table [ref=e273]:
                - caption
                - rowgroup [ref=e279]:
                  - row [ref=e280]:
                    - cell [ref=e281]:
                      - paragraph [ref=e282]: "1"
                    - cell [ref=e283]:
                      - paragraph [ref=e284]: Chassis LEDs (Beacon [BCN], Status [STS], and Environment [ENV])
                    - cell [ref=e285]:
                      - paragraph [ref=e286]: "4"
                    - cell [ref=e287]:
                      - paragraph [ref=e288]: Screw holes (6) for attaching rack mounting brackets
                  - row [ref=e289]:
                    - cell [ref=e290]:
                      - paragraph [ref=e291]: "2"
                    - cell [ref=e292]:
                      - paragraph [ref=e293]: 48 10/25-Gigabit SFP+ ports to other devices
                    - cell [ref=e294]:
                      - paragraph [ref=e295]: "5"
                    - cell [ref=e296]:
                      - paragraph [ref=e297]: Screw holes (2) for attaching grounding lug
                  - row [ref=e298]:
                    - cell [ref=e299]:
                      - paragraph [ref=e300]: "3"
                    - cell [ref=e301]:
                      - paragraph [ref=e302]: 6 40/100-Gigabit QSFP28 optical ports for uplink connections to aggregation switches
                    - cell [ref=e303]
                    - cell [ref=e304]
              - paragraph [ref=e305]:
                - text: To determine which transceivers, adapters, and cables this switch supports, see the
                - link "Cisco Transceiver Modules Compatibility Information" [ref=e306] [cursor=pointer]:
                  - /url: http://www.cisco.com/c/en/us/support/interfaces-modules/transceiver-modules/products-device-support-tables-list.html
                - text: document.
              - paragraph [ref=e307]: The following figure shows the hardware features seen from the power supply side of the chassis.
              - figure [ref=e308]:
                - link "Related image, diagram or screenshot." [ref=e309] [cursor=pointer]:
                  - /url: https://www.cisco.com/c/dam/en/us/td/i/500001-600000/500001-510000/500001-501000/500696.jpg
              - table [ref=e312]:
                - caption
                - rowgroup [ref=e318]:
                  - row [ref=e319]:
                    - cell [ref=e320]:
                      - paragraph [ref=e321]: "1"
                    - cell [ref=e322]:
                      - paragraph [ref=e323]: Two power supplies (one used for operations and one used for redundancy) (AC power supplies shown) with power supply slot 1 on the left and slot 2 on the right.
                    - cell [ref=e324]:
                      - paragraph [ref=e325]: "6"
                    - cell [ref=e326]:
                      - paragraph [ref=e327]: Out-of-band management port (SFP port)
                  - row [ref=e328]:
                    - cell [ref=e329]:
                      - paragraph [ref=e330]: "2"
                    - cell [ref=e331]:
                      - paragraph [ref=e332]: Four fan modules with fan slot 1 on the left and fan slot 4 on the right
                    - cell [ref=e333]:
                      - paragraph [ref=e334]: "7"
                    - cell [ref=e335]:
                      - paragraph [ref=e336]: USB port that is used for saving or copying functions.
                  - row [ref=e337]:
                    - cell [ref=e338]:
                      - paragraph [ref=e339]: "3"
                    - cell [ref=e340]:
                      - paragraph [ref=e341]: Console port (RS232 port)
                    - cell [ref=e342]:
                      - paragraph [ref=e343]: "8"
                    - cell [ref=e344]:
                      - paragraph [ref=e345]: Screw holes (6) for attaching rack mounting brackets
                  - row [ref=e346]:
                    - cell [ref=e347]:
                      - paragraph [ref=e348]: "4"
                    - cell [ref=e349]:
                      - paragraph [ref=e350]: Out-of-band management port (RJ-45 port)
                    - cell [ref=e351]:
                      - paragraph [ref=e352]: "9"
                    - cell [ref=e353]:
                      - paragraph [ref=e354]: Screw holes (2) for attaching grounding lug
                  - row [ref=e355]:
                    - cell [ref=e356]:
                      - paragraph [ref=e357]: "5"
                    - cell [ref=e358]:
                      - paragraph [ref=e359]: Chassis LEDs (Beacon [BCN] and Status [STS])
                    - cell [ref=e360]
                    - cell [ref=e361]
              - note [ref=e363]:
                - rowgroup [ref=e364]:
                  - row [ref=e365]:
                    - heading [ref=e366]:
                      - paragraph [ref=e368]: Note
                    - cell [ref=e369]:
                      - generic [ref=e370]:
                        - separator [ref=e371]
                        - text: There is a limit to USB 2.0 devices that use less than 2.5 W (less than 0.5 A inclusive of surge current). There is no support for devices, such as external hard drives, that instantaneously draw more than 0.5 A.
                        - separator [ref=e372]
              - paragraph [ref=e373]: Depending on whether you plan to position the ports in a hot or cold aisle, you can order the fan and power supply modules with port-side intake or port-side exhaust airflow. To determine the airflow direction of the modules installed in your switch, see the following table.
              - table [ref=e375]:
                - caption
                - rowgroup [ref=e380]:
                  - row [ref=e381]:
                    - columnheader [ref=e382]:
                      - paragraph [ref=e383]: Replaceable Modules
                    - columnheader [ref=e384]:
                      - paragraph [ref=e385]: Port-Side Intake Airflow Coloring
                    - columnheader [ref=e386]:
                      - paragraph [ref=e387]: Port-Side Exhaust Airflow Coloring
                - rowgroup [ref=e388]:
                  - row [ref=e389]:
                    - cell [ref=e390]:
                      - paragraph [ref=e391]: Fans
                    - cell [ref=e392]:
                      - paragraph [ref=e393]: Burgundy
                    - cell [ref=e394]:
                      - paragraph [ref=e395]: Blue
                  - row [ref=e396]:
                    - cell [ref=e397]:
                      - paragraph [ref=e398]: AC power supplies
                    - cell [ref=e399]:
                      - paragraph [ref=e400]: Burgundy
                    - cell [ref=e401]:
                      - paragraph [ref=e402]: Blue
                  - row [ref=e403]:
                    - cell [ref=e404]:
                      - paragraph [ref=e405]: HVAC/HVDC power supplies
                    - cell [ref=e406]:
                      - paragraph [ref=e407]: White
                  - row [ref=e408]:
                    - cell [ref=e409]:
                      - paragraph [ref=e410]: DC power supplies
                    - cell [ref=e411]:
                      - paragraph [ref=e412]: Green
                    - cell [ref=e413]:
                      - paragraph [ref=e414]: Gray
              - paragraph [ref=e415]: The fan and power supply modules are field replaceable and you can replace one fan module or one power supply module during operations so long as the other modules are operating. If you have only one power supply that is installed, you can install the replacement power supply in the open slot before removing the original power supply.
              - note [ref=e417]:
                - rowgroup [ref=e418]:
                  - row [ref=e419]:
                    - heading [ref=e420]:
                      - paragraph [ref=e422]: Note
                    - cell [ref=e423]:
                      - generic [ref=e424]:
                        - separator [ref=e425]
                        - text: Fans and power supply modules must have the same direction of airflow. Otherwise, the switch can overheat and shut down. If you are installing a dual-direction power supply, that module will automatically use the same airflow direction as the other modules in the switch.
                        - separator [ref=e426]
              - note [ref=e428]:
                - rowgroup [ref=e429]:
                  - row [ref=e430]:
                    - heading [ref=e431]:
                      - paragraph [ref=e433]: Caution
                    - cell [ref=e434]:
                      - generic [ref=e435]:
                        - separator [ref=e436]
                        - text: If the switch has port-side intake airflow (burgundy coloring for fan modules), you must locate the ports in the cold aisle. If the switch has port-side exhaust airflow (blue coloring for fan modules), you must locate the ports in the hot aisle. If you locate the air intake in a hot aisle, the switch can overheat and shut down.
                        - separator [ref=e437]
              - paragraph [ref=e438]:
