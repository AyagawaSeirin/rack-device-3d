                  - /url: "#Cisco_Concept.dita_164cbc47-d7c1-4399-be87-8196eab1da7b"
          - article [ref=e165]:
            - heading "Overview" [level=2] [ref=e166]
            - generic [ref=e167]:
              - paragraph [ref=e168]: "The Cisco N9K-C93180YC-FX switch is a 1-RU, fixed-port switch designed for Top-of-Rack (TOR), Middle-of-Rack (MoR), and End-of-Rack (EoR) deployment in data centers. This switch has 48 10/25-Gigabit SFP+ downlink ports that support 1-Gigabit, 10-Gigabit, and 25-Gigabit Ethernet connections and 8-, 16-, and 32-Gigabit Fibre Channel connections, and it has six fixed 40/100-Gigabit QSFP28 uplink ports that support combinations of 10-, 25-, 40-, 50-, and 100-Gigabit connectivity. You can set the downlink port speeds on a port-by-port basis. The chassis for this switch includes the following user-replaceable components:"
              - list [ref=e169]:
                - listitem [ref=e170]:
                  - paragraph [ref=e171]: "Fan modules (four) with the following airflow choices:"
                  - list [ref=e172]:
                    - listitem [ref=e173]:
                      - paragraph [ref=e174]: Port-side intake airflow with burgundy coloring (NXA-FAN-30CFM-B)
                    - listitem [ref=e175]:
                      - paragraph [ref=e176]: Port-side exhaust airflow with blue coloring (NXA-FAN-30CFM-F)
                      - note [ref=e177]:
                        - rowgroup [ref=e178]:
                          - row [ref=e179]:
                            - heading [ref=e180]:
                              - paragraph [ref=e182]: Note
                            - cell [ref=e183]:
                              - generic [ref=e184]:
                                - separator [ref=e185]
                                - paragraph [ref=e186]: The port-side intake airflow fan module with burgundy coloring can go from 0 to 55 degrees Celsius.
                                - separator [ref=e187]
                      - note [ref=e188]:
                        - rowgroup [ref=e189]:
                          - row [ref=e190]:
                            - heading [ref=e191]:
                              - paragraph [ref=e193]: Note
                            - cell [ref=e194]:
                              - generic [ref=e195]:
                                - separator [ref=e196]
                                - table [ref=e198]:
                                  - caption [ref=e199]: Table 1. Fan Speeds for This Switch
                                  - rowgroup [ref=e204]:
                                    - row [ref=e205]:
                                      - columnheader [ref=e206]
                                      - columnheader [ref=e207]:
                                        - paragraph [ref=e208]: Port-Side Intake
                                        - paragraph [ref=e209]: Fan Speed %
                                      - columnheader [ref=e210]:
                                        - paragraph [ref=e211]: Port-Side Exhaust
                                        - paragraph [ref=e212]: Fan Speed %
                                  - rowgroup [ref=e213]:
                                    - row [ref=e214]:
                                      - cell [ref=e215]:
                                        - paragraph [ref=e216]: Typical/Minimum
                                      - cell [ref=e217]:
                                        - paragraph [ref=e218]: 50%
                                      - cell [ref=e219]:
                                        - paragraph [ref=e220]: 70%
                                    - row [ref=e221]:
                                      - cell [ref=e222]:
                                        - paragraph [ref=e223]: Maximum
                                      - cell [ref=e224]:
                                        - paragraph [ref=e225]: 100%
                                      - cell [ref=e226]:
                                        - paragraph [ref=e227]: 100%
                                - separator [ref=e228]
                      - note [ref=e229]:
                        - rowgroup [ref=e230]:
                          - row [ref=e231]:
                            - heading [ref=e232]:
                              - paragraph [ref=e234]: Note
                            - cell [ref=e235]:
                              - generic [ref=e236]:
                                - separator [ref=e237]
                                - paragraph [ref=e238]: The switch has four fan modules. Each fan module has two rotors (a total of eight rotors in the switch). The switch can function normally if only one rotor inside any one fan module fails. In the case of more than one rotor failure, the switch will continue to operate if the failures are contained within a single fan module. To maintain safe operation, the switch requires at least three operational fan modules. If fewer than three fan modules are operational, the switch will issue a warning and power down in two minutes.
                                - separator [ref=e239]
                - listitem [ref=e240]:
                  - paragraph [ref=e241]: "Power supply modules (two—one for operations and one for redundancy [1+1]) with the following choices:"
                  - list [ref=e242]:
                    - listitem [ref=e243]:
                      - paragraph [ref=e244]: 500-W AC power supply with port-side exhaust airflow (blue coloring) (NXA-PAC-500W-PE)
                    - listitem [ref=e245]:
                      - paragraph [ref=e246]: 500-W AC power supply with port-side intake airflow (burgundy coloring) (NXA-PAC-500W-PI)
                    - listitem [ref=e247]:
                      - paragraph [ref=e248]: 1200-W HVAC/HVDC power supply with dual-direction airflow (white coloring) (N9K-PUV-1200W)
                    - listitem [ref=e249]:
                      - paragraph [ref=e250]: 930-W DC power supply with port-side exhaust airflow (blue coloring) (NXA-PDC-930W-PE)
                    - listitem [ref=e251]:
                      - paragraph [ref=e252]: 930-W DC power supply with port-side intake airflow (burgundy coloring) (NXA-PDC-930W-PI)
                  - note [ref=e253]:
                    - rowgroup [ref=e254]:
                      - row [ref=e255]:
                        - heading [ref=e256]:
                          - paragraph [ref=e258]: Note
                        - cell [ref=e259]:
                          - generic [ref=e260]:
                            - separator [ref=e261]
                            - paragraph [ref=e262]: Both power supplies must be the same type of power source. Do not mix AC and DC power sources.
                            - separator [ref=e263]
                  - note [ref=e264]:
                    - rowgroup [ref=e265]:
                      - row [ref=e266]:
                        - heading [ref=e267]:
                          - paragraph [ref=e269]: Note
                        - cell [ref=e270]:
                          - generic [ref=e271]:
                            - separator [ref=e272]
                            - paragraph [ref=e273]: All fan modules and power supplies must use the same airflow direction during operations. If you are using the 1200-W HVAC/HVDC power supply, the power supply automatically uses the same airflow direction as used by the other modules in the switch.
                            - separator [ref=e274]
              - paragraph [ref=e275]:
                - strong [ref=e276]: Deployment Scheme for SFP-10G-T-X and SFP-10G-OLT20-X Transceivers
              - paragraph [ref=e277]: The following figure shows the maximum configuration density of SFP-10G-T-X and SFP-10G-OLT20-X SFP transceivers.
              - link "Related image, diagram or screenshot." [ref=e278] [cursor=pointer]:
                - /url: https://www.cisco.com/c/dam/en/us/td/i/500001-600000/500001-510000/503001-504000/503038.jpg
              - table [ref=e281]:
                - caption
