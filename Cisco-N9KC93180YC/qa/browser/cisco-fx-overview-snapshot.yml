                  - row [ref=e286]:
                    - cell [ref=e287]:
                      - link "Related image, diagram or screenshot." [ref=e288] [cursor=pointer]:
                        - /url: https://www.cisco.com/c/dam/en/us/td/i/500001-600000/500001-510000/504001-505000/504774.jpg
                    - cell "Active port deploying the SFP 10GBASE-T or 10G-OLT20 transceivers, with maximum power consumption up to 2.5W. Once configured with media-type 10g-tx command in NX-OS, “Link Level Policy -> Physical Media Type -> SFP 10G TX” in ACI, these ports can deploy SFP-10G-T-X. Without such configuration, they behave like normal ports. Use the media-type high-power command in NX-OS to deploy SFP-10G-OLT20 on these ports. Without such configuration, they behave like normal ports." [ref=e290]:
                      - paragraph [ref=e291]: Active port deploying the SFP 10GBASE-T or 10G-OLT20 transceivers, with maximum power consumption up to 2.5W.
                      - paragraph [ref=e292]:
                        - text: Once configured with
