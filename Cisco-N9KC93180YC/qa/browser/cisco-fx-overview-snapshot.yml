                            - paragraph [ref=e563]: This switch runs with +1 redundancy mode, so that if one fan fails, the switch can sustain operation. But if a second fan fails, this switch is not designed to sustain operation. Before waiting to reach major threshold temperature, the switch will power down due to Powered-down due to fan policy trigger.
