                  - row [ref=e297]:
                    - cell [ref=e298]:
                      - link "Related image, diagram or screenshot." [ref=e299] [cursor=pointer]:
                        - /url: https://www.cisco.com/c/dam/en/us/td/i/500001-600000/500001-510000/504001-505000/504775.jpg
                    - cell "Ports must either be empty or active with passive copper cables only (Maximum power consumption up to 0.1W). When media-type 10g-tx or media-type high-power is configured on yellow ports, ports to the left, right, top, and bottom of the yellow port are referenced as blue ports. These adjacent ports will then support only low power Passive Copper DAC cable, or these can be left empty to conserve power. If the media-type 10g-tx or media-type high-power configuration is removed from the adjacent yellow ports, the blue ports will revert to behaving like normal ports." [ref=e301]:
