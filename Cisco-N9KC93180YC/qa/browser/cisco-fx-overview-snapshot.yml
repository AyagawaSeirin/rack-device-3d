                    - cell [ref=e312]:
                      - paragraph [ref=e313]: Active port deploying any Cisco 1/10/25G optics (SFP, SFP+, SFP28) EXCLUDING SFP 10GBASE-T and 10G-OLT, with maximum power consumption up to 1.5W. These ports are not part of any scheme and can deploy all regular Cisco optics and behave like normal ports.
                      - paragraph [ref=e314]: Active ports 17 to 36, deploying any Cisco 1/10/25G optics (SFP, SFP+, SFP28) EXCLUDING SFP 10GBASE-T and 10G-OLT, with maximum power consumption up to 1.5W and active ports 49 to 54, deploying any Cisco QSFP, QSFP+, QSFP28, with maximum power consumption up to 3.5W. These ports are not part of any scheme and can deploy all regular Cisco optics and behave like normal ports.
