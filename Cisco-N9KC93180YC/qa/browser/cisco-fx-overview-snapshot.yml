              - paragraph [ref=e464]: The fan and power supply modules are field replaceable and you can replace one fan module or one power supply module during operations so long as the other modules are operating. If you have only one power supply that is installed, you can install the replacement power supply in the open slot before removing the original power supply.
              - note [ref=e466]:
                - rowgroup [ref=e467]:
                  - row [ref=e468]:
                    - heading [ref=e469]:
                      - paragraph [ref=e471]: Note
                    - cell [ref=e472]:
                      - generic [ref=e473]:
                        - separator [ref=e474]
                        - text: Fans and power supply modules must have the same direction of airflow. Otherwise, the switch can overheat and shut down. If you are installing a dual-direction power supply, that module will automatically use the same airflow direction as the other modules in the switch.
                        - separator [ref=e475]
              - note [ref=e477]:
                - rowgroup [ref=e478]:
                  - row [ref=e479]:
                    - heading [ref=e480]:
                      - paragraph [ref=e482]: Caution
                    - cell [ref=e483]:
                      - generic [ref=e484]:
                        - separator [ref=e485]
                        - text: If the switch has port-side intake airflow (burgundy coloring for fan modules), you must locate the ports in the cold aisle. If the switch has port-side exhaust airflow (blue coloring for fan modules), you must locate the ports in the hot aisle. If you locate the air intake in a hot aisle, the switch can overheat and shut down.
                        - separator [ref=e486]
