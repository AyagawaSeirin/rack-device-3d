<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FG-1500D Three.js QA Viewer</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #d6d9da; }
    canvas { display: block; width: 100%; height: 100%; }
    #error { position: fixed; inset: 16px; color: #8d1111; font: 15px/1.4 sans-serif; white-space: pre-wrap; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "./node_modules/three/build/three.module.js",
        "three/addons/": "./node_modules/three/examples/jsm/"
      }
    }
  </script>
</head>
<body data-ready="false">
  <div id="error"></div>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const params = new URLSearchParams(location.search);
    const variant = params.get('model') === 'web' ? 'web' : 'standard';
    const view = params.get('view') || 'front';
    const filename = variant === 'web' ? 'Fortinet-FG1500D-web.glb' : 'Fortinet-FG1500D.glb';
    const viewDirections = {
      front: [0, 0, 1],
      rear: [0, 0, -1],
      left: [-1, 0, 0],
      right: [1, 0, 0],
      top: [0, 1, 0],
      bottom: [0, -1, 0],
      'front-left': [-0.82, 0.43, 1],
      'front-right': [0.82, 0.43, 1],
      'rear-left': [-0.82, 0.43, -1],
      'rear-right': [0.82, 0.43, -1]
    };
    const viewUps = {
      top: [0, 0, -1],
      bottom: [0, 0, 1]
    };

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, preserveDrawingBuffer: true });
    renderer.setPixelRatio(1);
    renderer.setSize(innerWidth, innerHeight, false);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.NoToneMapping;
    renderer.setClearColor(0xd6d9da, 1);
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xd6d9da);
    scene.add(new THREE.HemisphereLight(0xffffff, 0x62686a, 1.65));
    const key = new THREE.DirectionalLight(0xffffff, 2.1);
    key.position.set(2.2, 3.4, 4.2);
    scene.add(key);
    const fill = new THREE.DirectionalLight(0xffffff, 1.1);
    fill.position.set(-3.0, 1.3, -2.6);
    scene.add(fill);

    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.001, 20);

    function fitCamera(object, directionArray, upArray) {
      const box = new THREE.Box3().setFromObject(object);
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());
      const direction = new THREE.Vector3(...directionArray).normalize();
      const up = new THREE.Vector3(...upArray).normalize();
      const distance = Math.max(size.x, size.y, size.z) * 3.0;
      camera.position.copy(center).add(direction.multiplyScalar(distance));
      camera.up.copy(up);
      camera.lookAt(center);
      camera.updateMatrixWorld(true);

      const corners = [];
      for (const x of [box.min.x, box.max.x]) {
        for (const y of [box.min.y, box.max.y]) {
          for (const z of [box.min.z, box.max.z]) {
            corners.push(new THREE.Vector3(x, y, z).applyMatrix4(camera.matrixWorldInverse));
          }
        }
      }
      const minX = Math.min(...corners.map((point) => point.x));
      const maxX = Math.max(...corners.map((point) => point.x));
      const minY = Math.min(...corners.map((point) => point.y));
      const maxY = Math.max(...corners.map((point) => point.y));
      let width = (maxX - minX) * 1.10;
      let height = (maxY - minY) * 1.10;
      const aspect = innerWidth / innerHeight;
      if (width / height > aspect) height = width / aspect;
      else width = height * aspect;
      camera.left = -width / 2;
      camera.right = width / 2;
      camera.top = height / 2;
      camera.bottom = -height / 2;
      camera.near = 0.001;
      camera.far = distance * 2.2;
      camera.updateProjectionMatrix();
    }

    try {
      const gltf = await new GLTFLoader().loadAsync(`../../model/${filename}`);
      scene.add(gltf.scene);
      const direction = viewDirections[view] || viewDirections.front;
      const up = viewUps[view] || [0, 1, 0];
      fitCamera(gltf.scene, direction, up);
      renderer.render(scene, camera);
      await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
      renderer.render(scene, camera);
      document.body.dataset.ready = 'true';
      document.body.dataset.engine = 'threejs';
      document.body.dataset.variant = variant;
      document.body.dataset.view = view;
    } catch (error) {
      document.querySelector('#error').textContent = String(error?.stack || error);
      document.body.dataset.ready = 'error';
      throw error;
    }
  </script>
</body>
</html>
