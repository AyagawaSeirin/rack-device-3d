<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FG-1500D Babylon.js QA Viewer</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #d6d9da; }
    canvas { display: block; width: 100%; height: 100%; outline: none; }
    #error { position: fixed; inset: 16px; color: #8d1111; font: 15px/1.4 sans-serif; white-space: pre-wrap; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "@babylonjs/core": "./node_modules/@babylonjs/core/index.js",
        "@babylonjs/core/": "./node_modules/@babylonjs/core/",
        "@babylonjs/loaders/": "./node_modules/@babylonjs/loaders/"
      }
    }
  </script>
</head>
<body data-ready="false">
  <canvas id="renderCanvas"></canvas>
  <div id="error"></div>
  <script type="module">
    import {
      BoundingBox,
      Camera,
      Color4,
      DirectionalLight,
      Engine,
      FreeCamera,
      HemisphericLight,
      Scene,
      SceneLoader,
      Vector3
    } from '@babylonjs/core';
    import '@babylonjs/loaders/glTF/index.js';

    const params = new URLSearchParams(location.search);
    const variant = params.get('model') === 'web' ? 'web' : 'standard';
    const view = params.get('view') || 'front';
    const filename = variant === 'web' ? 'Fortinet-FG1500D-web.glb' : 'Fortinet-FG1500D.glb';
    const viewDirections = {
      front: [0, 0, 1],
      rear: [0, 0, -1],
      left: [-1, 0, 0],
      right: [1, 0, 0],
      top: [0, 1, 0],
      bottom: [0, -1, 0],
      'front-left': [-0.82, 0.43, 1],
      'front-right': [0.82, 0.43, 1],
      'rear-left': [-0.82, 0.43, -1],
      'rear-right': [0.82, 0.43, -1]
    };
    const viewUps = {
      top: [0, 0, -1],
      bottom: [0, 0, 1]
    };

    const canvas = document.querySelector('#renderCanvas');
    const engine = new Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true }, false);
    engine.setHardwareScalingLevel(1);
    engine.resize();
    const scene = new Scene(engine);
    scene.useRightHandedSystem = true;
    scene.clearColor = new Color4(0.839, 0.851, 0.855, 1);
    scene.imageProcessingConfiguration.toneMappingEnabled = false;
    scene.imageProcessingConfiguration.exposure = 1;
    scene.imageProcessingConfiguration.contrast = 1;

    new HemisphericLight('hemi', new Vector3(0, 1, 0), scene).intensity = 1.65;
    const key = new DirectionalLight('key', new Vector3(-2.2, -3.4, -4.2), scene);
    key.intensity = 2.1;
    const fill = new DirectionalLight('fill', new Vector3(3.0, -1.3, 2.6), scene);
    fill.intensity = 1.1;

    function allCorners(minimum, maximum) {
      const corners = [];
      for (const x of [minimum.x, maximum.x]) {
        for (const y of [minimum.y, maximum.y]) {
          for (const z of [minimum.z, maximum.z]) corners.push(new Vector3(x, y, z));
        }
      }
      return corners;
    }

    function computeBounds(meshes) {
      let minimum = new Vector3(Number.POSITIVE_INFINITY, Number.POSITIVE_INFINITY, Number.POSITIVE_INFINITY);
      let maximum = new Vector3(Number.NEGATIVE_INFINITY, Number.NEGATIVE_INFINITY, Number.NEGATIVE_INFINITY);
      for (const mesh of meshes) {
        if (!mesh.getTotalVertices()) continue;
        mesh.computeWorldMatrix(true);
        const box = mesh.getBoundingInfo().boundingBox;
        minimum = Vector3.Minimize(minimum, box.minimumWorld);
        maximum = Vector3.Maximize(maximum, box.maximumWorld);
      }
      return { minimum, maximum };
    }

    function fitCamera(camera, bounds, directionArray, upArray) {
      const center = bounds.minimum.add(bounds.maximum).scale(0.5);
      const size = bounds.maximum.subtract(bounds.minimum);
      const direction = new Vector3(...directionArray).normalize();
      const up = new Vector3(...upArray).normalize();
      const distance = Math.max(size.x, size.y, size.z) * 3.0;
      camera.position.copyFrom(center.add(direction.scale(distance)));
      camera.upVector.copyFrom(up);
      camera.setTarget(center);

      const forward = center.subtract(camera.position).normalize();
      const right = Vector3.Cross(forward, up).normalize();
      const trueUp = Vector3.Cross(right, forward).normalize();
      const corners = allCorners(bounds.minimum, bounds.maximum);
      const xs = corners.map((point) => Vector3.Dot(point.subtract(center), right));
      const ys = corners.map((point) => Vector3.Dot(point.subtract(center), trueUp));
      let width = (Math.max(...xs) - Math.min(...xs)) * 1.10;
      let height = (Math.max(...ys) - Math.min(...ys)) * 1.10;
      const aspect = engine.getRenderWidth() / engine.getRenderHeight();
      if (width / height > aspect) height = width / aspect;
      else width = height * aspect;
      camera.mode = Camera.ORTHOGRAPHIC_CAMERA;
      camera.orthoLeft = -width / 2;
      camera.orthoRight = width / 2;
      camera.orthoTop = height / 2;
      camera.orthoBottom = -height / 2;
      camera.minZ = 0.001;
      camera.maxZ = distance * 2.2;
    }

    try {
      const result = await SceneLoader.ImportMeshAsync('', '../../model/', filename, scene);
      const bounds = computeBounds(result.meshes);
      const direction = viewDirections[view] || viewDirections.front;
      const up = viewUps[view] || [0, 1, 0];
      const camera = new FreeCamera('qa-camera', Vector3.Zero(), scene);
      fitCamera(camera, bounds, direction, up);
      scene.activeCamera = camera;
      document.body.dataset.bounds = JSON.stringify({
        min: bounds.minimum.asArray(),
        max: bounds.maximum.asArray()
      });
      document.body.dataset.camera = JSON.stringify({
        position: camera.position.asArray(),
        target: camera.getTarget().asArray(),
        ortho: [camera.orthoLeft, camera.orthoRight, camera.orthoTop, camera.orthoBottom],
        clip: [camera.minZ, camera.maxZ]
      });
      engine.runRenderLoop(() => scene.render());
      await scene.whenReadyAsync();
      await new Promise((resolve) => setTimeout(resolve, 450));
      document.body.dataset.ready = 'true';
      document.body.dataset.engine = 'babylonjs';
      document.body.dataset.variant = variant;
      document.body.dataset.view = view;
    } catch (error) {
      document.querySelector('#error').textContent = String(error?.stack || error);
      document.body.dataset.ready = 'error';
      throw error;
    }
  </script>
</body>
</html>
