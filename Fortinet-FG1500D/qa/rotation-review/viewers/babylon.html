<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Babylon.js rotation stress viewer</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background-color:#e8ebed;background-image:linear-gradient(45deg,#c9ced2 25%,transparent 25%),linear-gradient(-45deg,#c9ced2 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#c9ced2 75%),linear-gradient(-45deg,transparent 75%,#c9ced2 75%);background-size:32px 32px;background-position:0 0,0 16px,16px -16px,-16px 0}body.dark{background-color:#22272a;background-image:linear-gradient(45deg,#444b4f 25%,transparent 25%),linear-gradient(-45deg,#444b4f 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#444b4f 75%),linear-gradient(-45deg,transparent 75%,#444b4f 75%)}canvas{display:block;width:100%;height:100%;touch-action:none}#badge{position:fixed;left:10px;top:8px;padding:4px 7px;background:#111c;color:white;font:12px system-ui;z-index:2}
  </style>
  <script src="https://cdn.babylonjs.com/babylon.js"></script><script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
</head>
<body data-ready="false"><div id="badge">loading</div><canvas id="renderCanvas"></canvas>
<script>
(async()=>{
  const params=new URLSearchParams(location.search),model=params.get('model'),variant=params.get('variant')||'unknown';if(!model)throw new Error('missing ?model= URL');let pose={yaw:0,pitch:15,bg:params.get('bg')==='dark'?'dark':'light'};document.body.classList.toggle('dark',pose.bg);
  const canvas=document.getElementById('renderCanvas'),engine=new BABYLON.Engine(canvas,true,{preserveDrawingBuffer:true,stencil:true,alpha:true},false);engine.setHardwareScalingLevel(1);engine.resize();BABYLON.SceneLoader.ShowLoadingScreen=false;
  const scene=new BABYLON.Scene(engine);scene.useRightHandedSystem=true;scene.clearColor=new BABYLON.Color4(0,0,0,0);scene.imageProcessingConfiguration.toneMappingEnabled=false;scene.imageProcessingConfiguration.exposure=1;scene.imageProcessingConfiguration.contrast=1;
  const hemi=new BABYLON.HemisphericLight('hemi',new BABYLON.Vector3(0,1,0),scene);hemi.intensity=1.5;hemi.groundColor=new BABYLON.Color3(.45,.47,.49);const key=new BABYLON.DirectionalLight('key',new BABYLON.Vector3(-.4,-.7,-.5),scene);key.position=new BABYLON.Vector3(2,3,4);key.intensity=1.25;
  await BABYLON.SceneLoader.AppendAsync('',model,scene);engine.hideLoadingUI();let min=new BABYLON.Vector3(Infinity,Infinity,Infinity),max=new BABYLON.Vector3(-Infinity,-Infinity,-Infinity);for(const mesh of scene.meshes){if(!mesh.getTotalVertices())continue;mesh.computeWorldMatrix(true);const b=mesh.getBoundingInfo().boundingBox;min=BABYLON.Vector3.Minimize(min,b.minimumWorld);max=BABYLON.Vector3.Maximize(max,b.maximumWorld)}
  const center=min.add(max).scale(.5);for(const mesh of scene.meshes){if(!mesh.parent)mesh.position.subtractInPlace(center)}for(const mesh of scene.meshes)mesh.computeWorldMatrix(true);min=new BABYLON.Vector3(Infinity,Infinity,Infinity);max=new BABYLON.Vector3(-Infinity,-Infinity,-Infinity);for(const mesh of scene.meshes){if(!mesh.getTotalVertices())continue;const b=mesh.getBoundingInfo().boundingBox;min=BABYLON.Vector3.Minimize(min,b.minimumWorld);max=BABYLON.Vector3.Maximize(max,b.maximumWorld)}
  const size=max.subtract(min),radius=Math.max(size.x,size.y,size.z)*1.72,camera=new BABYLON.ArcRotateCamera('orbit',Math.PI/2,Math.PI/2,radius,BABYLON.Vector3.Zero(),scene);camera.minZ=Math.max(.005,radius/180);camera.maxZ=radius*12;camera.lowerRadiusLimit=radius*.65;camera.upperRadiusLimit=radius*2.5;camera.attachControl(canvas,true);scene.activeCamera=camera;
  const materialState=scene.materials.map(material=>({material:material.name,alpha:material.alpha,transparencyMode:material.transparencyMode,backFaceCulling:material.backFaceCulling,disableDepthWrite:material.disableDepthWrite,alphaCutOff:material.alphaCutOff}));
  async function setPose(yaw,pitch=15,bg=pose.bg){pose={yaw:Number(yaw),pitch:Number(pitch),bg};document.body.classList.toggle('dark',bg==='dark');const yr=BABYLON.Tools.ToRadians(pose.yaw),pr=BABYLON.Tools.ToRadians(pose.pitch),cp=Math.cos(pr);camera.setPosition(new BABYLON.Vector3(radius*Math.sin(yr)*cp,radius*Math.sin(pr),radius*Math.cos(yr)*cp));camera.setTarget(BABYLON.Vector3.Zero());scene.render();await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));scene.render();return getState()}
  function getState(){return{engine:`Babylon.js ${BABYLON.Engine.Version}`,webgl:`WebGL ${engine.webGLVersion}`,model,variant,pose,bounds:size.asArray(),camera:{position:camera.position.asArray(),near:camera.minZ,far:camera.maxZ},materials:materialState,renderer:{alpha:true,toneMapping:scene.imageProcessingConfiguration.toneMappingEnabled}}}
  window.__rotationQA={setPose,getState,render:()=>scene.render(),canvas};await setPose(0,15,pose.bg);document.body.dataset.ready='true';document.body.dataset.engine='babylon';document.getElementById('badge').textContent=`Babylon.js · ${variant}`;engine.runRenderLoop(()=>scene.render());addEventListener('resize',()=>engine.resize());
})().catch(error=>{document.body.dataset.ready='error';document.body.dataset.error=String(error);console.error(error)});
</script></body></html>
