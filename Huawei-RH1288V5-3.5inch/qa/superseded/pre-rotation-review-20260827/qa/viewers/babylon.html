<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Babylon.js Huawei 1288H V5 QA</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden} body{background-color:#d8dadd;background-image:linear-gradient(45deg,#c5c8cc 25%,transparent 25%),linear-gradient(-45deg,#c5c8cc 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#c5c8cc 75%),linear-gradient(-45deg,transparent 75%,#c5c8cc 75%);background-size:32px 32px;background-position:0 0,0 16px,16px -16px,-16px 0} canvas{width:100%;height:100%;display:block;touch-action:none} #label{position:fixed;left:18px;top:16px;padding:7px 10px;border-radius:4px;color:#20252a;background:rgba(255,255,255,.88);font:600 14px/1.2 system-ui,sans-serif;z-index:2}
  </style>
</head>
<body><div id="label"></div><canvas id="renderCanvas"></canvas>
<script src="https://cdn.babylonjs.com/babylon.js"></script><script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
<script>
(async()=>{
  const params=new URLSearchParams(location.search),view=params.get('view')||'front',model=params.get('model')==='standard'?'standard':'web'; if(params.get('compare')==='1'){document.body.style.background='#ffffff';document.body.style.backgroundImage='none'}
  const filename=`Huawei-RH1288V5-3.5inch${model==='web'?'-web':''}.glb`; document.getElementById('label').textContent=`Babylon.js · ${model} · ${view}`;
  const canvas=document.getElementById('renderCanvas'),engine=new BABYLON.Engine(canvas,true,{preserveDrawingBuffer:true,stencil:true},false); engine.setHardwareScalingLevel(1);
  const scene=new BABYLON.Scene(engine); scene.clearColor=new BABYLON.Color4(0,0,0,0); scene.imageProcessingConfiguration.toneMappingEnabled=false;
  const hemi=new BABYLON.HemisphericLight('hemi',new BABYLON.Vector3(0,1,0),scene); hemi.intensity=1.55; hemi.groundColor=new BABYLON.Color3(.48,.5,.53);
  const key=new BABYLON.DirectionalLight('key',new BABYLON.Vector3(-.4,-.7,-.5),scene); key.position=new BABYLON.Vector3(2,3,4); key.intensity=1.2;
  const defs={front:{dir:[0,0,1],up:[0,1,0],ortho:true},rear:{dir:[0,0,-1],up:[0,1,0],ortho:true},right:{dir:[1,0,0],up:[0,1,0],ortho:true},left:{dir:[-1,0,0],up:[0,1,0],ortho:true},top:{dir:[0,1,0],up:[0,0,-1],ortho:true},bottom:{dir:[0,-1,0],up:[0,0,-1],ortho:true},frontLeft:{dir:[-1.15,.58,1.35],up:[0,1,0]},frontRight:{dir:[1.15,.58,1.35],up:[0,1,0]},rearLeft:{dir:[-1.15,.58,-1.35],up:[0,1,0]},rearRight:{dir:[1.15,.58,-1.35],up:[0,1,0]}};
  try{
    await BABYLON.SceneLoader.AppendAsync('/model/',filename,scene);
    let min=new BABYLON.Vector3(Infinity,Infinity,Infinity),max=new BABYLON.Vector3(-Infinity,-Infinity,-Infinity);
    for(const mesh of scene.meshes){if(!mesh.getTotalVertices())continue;mesh.computeWorldMatrix(true);const b=mesh.getBoundingInfo().boundingBox;min=BABYLON.Vector3.Minimize(min,b.minimumWorld);max=BABYLON.Vector3.Maximize(max,b.maximumWorld)}
    const center=min.add(max).scale(.5),size=max.subtract(min),spec=defs[view]||defs.front,dir=new BABYLON.Vector3(...spec.dir).normalize(),up=new BABYLON.Vector3(...spec.up).normalize();
    const camera=new BABYLON.FreeCamera('camera',center.add(dir.scale(2)),scene); camera.upVector=up; camera.setTarget(center); camera.minZ=.01; camera.maxZ=20;
    if(spec.ortho){
      camera.mode=BABYLON.Camera.ORTHOGRAPHIC_CAMERA; camera.computeWorldMatrix(true); const right=camera.getDirection(BABYLON.Axis.X).normalize(),trueUp=camera.getDirection(BABYLON.Axis.Y).normalize();
      const corners=[]; for(const x of [min.x,max.x])for(const y of [min.y,max.y])for(const z of [min.z,max.z])corners.push(new BABYLON.Vector3(x,y,z).subtract(center));
      const xs=corners.map(p=>BABYLON.Vector3.Dot(p,right)),ys=corners.map(p=>BABYLON.Vector3.Dot(p,trueUp)); const w=Math.max(...xs)-Math.min(...xs),h=Math.max(...ys)-Math.min(...ys),aspect=engine.getRenderWidth()/engine.getRenderHeight(),halfH=Math.max(h/2,w/(2*aspect))*1.13;
      camera.orthoLeft=-halfH*aspect;camera.orthoRight=halfH*aspect;camera.orthoTop=halfH;camera.orthoBottom=-halfH;
    }else{camera.fov=28*Math.PI/180;camera.position=center.add(dir.scale(Math.max(size.x,size.y,size.z)*2.35));camera.setTarget(center)}
    scene.activeCamera=camera;engine.resize();scene.render();document.body.dataset.ready='1';document.title=`READY Babylon ${model} ${view}`;engine.runRenderLoop(()=>scene.render());
  }catch(error){document.body.dataset.error=String(error);document.title='ERROR Babylon';console.error(error)}
})();
</script></body></html>
