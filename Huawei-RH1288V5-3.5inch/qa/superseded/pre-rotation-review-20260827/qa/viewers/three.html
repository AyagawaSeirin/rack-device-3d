<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Three.js Huawei 1288H V5 QA</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body { background-color: #d8dadd; background-image: linear-gradient(45deg,#c5c8cc 25%,transparent 25%),linear-gradient(-45deg,#c5c8cc 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#c5c8cc 75%),linear-gradient(-45deg,transparent 75%,#c5c8cc 75%); background-size: 32px 32px; background-position: 0 0,0 16px,16px -16px,-16px 0; }
    canvas { display: block; width: 100%; height: 100%; }
    #label { position: fixed; left: 18px; top: 16px; padding: 7px 10px; border-radius: 4px; color: #20252a; background: rgba(255,255,255,.88); font: 600 14px/1.2 system-ui,sans-serif; z-index: 2; }
  </style>
</head>
<body><div id="label"></div>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.180.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.180.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const params = new URLSearchParams(location.search);
const view = params.get('view') || 'front';
const model = params.get('model') === 'standard' ? 'standard' : 'web';
if (params.get('compare') === '1') { document.body.style.background = '#ffffff'; document.body.style.backgroundImage = 'none'; }
const filename = `Huawei-RH1288V5-3.5inch${model === 'web' ? '-web' : ''}.glb`;
document.getElementById('label').textContent = `Three.js · ${model} · ${view}`;

const renderer = new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(1);
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xffffff,0x72777d,1.9));
const key = new THREE.DirectionalLight(0xffffff,1.5); key.position.set(2,3,4); scene.add(key);
const fill = new THREE.DirectionalLight(0xffffff,0.8); fill.position.set(-3,1,-2); scene.add(fill);

const defs = {
  front:{dir:[0,0,1],up:[0,1,0],ortho:true}, rear:{dir:[0,0,-1],up:[0,1,0],ortho:true},
  right:{dir:[1,0,0],up:[0,1,0],ortho:true}, left:{dir:[-1,0,0],up:[0,1,0],ortho:true},
  top:{dir:[0,1,0],up:[0,0,-1],ortho:true}, bottom:{dir:[0,-1,0],up:[0,0,-1],ortho:true},
  frontLeft:{dir:[-1.15,.58,1.35],up:[0,1,0]}, frontRight:{dir:[1.15,.58,1.35],up:[0,1,0]},
  rearLeft:{dir:[-1.15,.58,-1.35],up:[0,1,0]}, rearRight:{dir:[1.15,.58,-1.35],up:[0,1,0]}
};

function fitOrtho(camera, box, center) {
  camera.updateMatrixWorld(true); camera.matrixWorldInverse.copy(camera.matrixWorld).invert();
  const xs=[], ys=[];
  for (const x of [box.min.x,box.max.x]) for (const y of [box.min.y,box.max.y]) for (const z of [box.min.z,box.max.z]) {
    const p=new THREE.Vector3(x,y,z).applyMatrix4(camera.matrixWorldInverse); xs.push(p.x); ys.push(p.y);
  }
  const w=Math.max(...xs)-Math.min(...xs), h=Math.max(...ys)-Math.min(...ys), aspect=innerWidth/innerHeight;
  const halfH=Math.max(h/2,w/(2*aspect))*1.13, halfW=halfH*aspect;
  camera.left=-halfW; camera.right=halfW; camera.top=halfH; camera.bottom=-halfH; camera.updateProjectionMatrix();
}

new GLTFLoader().load(`/model/${filename}`, (gltf) => {
  const root=gltf.scene; scene.add(root); root.updateMatrixWorld(true);
  const box=new THREE.Box3().setFromObject(root), center=box.getCenter(new THREE.Vector3()), size=box.getSize(new THREE.Vector3());
  const spec=defs[view]||defs.front, dir=new THREE.Vector3(...spec.dir).normalize(), up=new THREE.Vector3(...spec.up).normalize();
  let camera;
  if (spec.ortho) {
    camera=new THREE.OrthographicCamera(-1,1,1,-1,.01,10); camera.position.copy(center).add(dir.multiplyScalar(2)); camera.up.copy(up); camera.lookAt(center); fitOrtho(camera,box,center);
  } else {
    camera=new THREE.PerspectiveCamera(28,innerWidth/innerHeight,.01,20); camera.position.copy(center).add(dir.multiplyScalar(Math.max(size.x,size.y,size.z)*2.35)); camera.up.copy(up); camera.lookAt(center);
  }
  renderer.render(scene,camera); document.body.dataset.ready='1'; document.title=`READY Three ${model} ${view}`;
}, undefined, (error)=>{document.body.dataset.error=String(error);document.title='ERROR Three';console.error(error)});
</script></body></html>
