<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Three revalidation</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background-color:#d8dadd;background-image:linear-gradient(45deg,#c5c8cc 25%,transparent 25%),linear-gradient(-45deg,#c5c8cc 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#c5c8cc 75%),linear-gradient(-45deg,transparent 75%,#c5c8cc 75%);background-size:32px 32px;background-position:0 0,0 16px,16px -16px,-16px 0}canvas{display:block;width:100%;height:100%}#label{position:fixed;left:14px;top:12px;z-index:2;max-width:calc(100vw - 48px);padding:8px 10px;border-radius:5px;background:rgba(255,255,255,.94);color:#182028;font:600 12px/1.35 ui-monospace,monospace;overflow-wrap:anywhere}
</style></head><body><div id="label">initializing</div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.180.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.180.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three'; import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const params=new URLSearchParams(location.search),view=params.get('view')||'front',variant=params.get('model')==='standard'?'standard':'web',expected=params.get('expected')||'',run=params.get('run')||'0';
const filename=`Huawei-RH1288V5-3.5inch${variant==='web'?'-web':''}.glb`,label=document.getElementById('label');
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
const defs={front:{dir:[0,0,1],up:[0,1,0],ortho:1},rear:{dir:[0,0,-1],up:[0,1,0],ortho:1},right:{dir:[1,0,0],up:[0,1,0],ortho:1},left:{dir:[-1,0,0],up:[0,1,0],ortho:1},top:{dir:[0,1,0],up:[0,0,-1],ortho:1},bottom:{dir:[0,-1,0],up:[0,0,-1],ortho:1},frontLeft:{dir:[-1.15,.58,1.35],up:[0,1,0]},frontRight:{dir:[1.15,.58,1.35],up:[0,1,0]},rearLeft:{dir:[-1.15,.58,-1.35],up:[0,1,0]},rearRight:{dir:[1.15,.58,-1.35],up:[0,1,0]}};
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});renderer.setPixelRatio(1);renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.NoToneMapping;renderer.setClearColor(0,0);document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.add(new THREE.HemisphereLight(0xffffff,0x72777d,1.9));const key=new THREE.DirectionalLight(0xffffff,1.5);key.position.set(2,3,4);scene.add(key);const fill=new THREE.DirectionalLight(0xffffff,.8);fill.position.set(-3,1,-2);scene.add(fill);
function fit(camera,box){camera.updateMatrixWorld(true);camera.matrixWorldInverse.copy(camera.matrixWorld).invert();const xs=[],ys=[];for(const x of[box.min.x,box.max.x])for(const y of[box.min.y,box.max.y])for(const z of[box.min.z,box.max.z]){const p=new THREE.Vector3(x,y,z).applyMatrix4(camera.matrixWorldInverse);xs.push(p.x);ys.push(p.y)}const w=Math.max(...xs)-Math.min(...xs),h=Math.max(...ys)-Math.min(...ys),a=innerWidth/innerHeight,hh=Math.max(h/2,w/(2*a))*1.13;camera.left=-hh*a;camera.right=hh*a;camera.top=hh;camera.bottom=-hh;camera.updateProjectionMatrix()}
try{
 const response=await fetch(`/model/${filename}?revalidation=${encodeURIComponent(run)}&engine=three&view=${encodeURIComponent(view)}`,{cache:'no-store'});if(!response.ok)throw new Error(`HTTP ${response.status}`);const bytes=await response.arrayBuffer(),sha=hex(await crypto.subtle.digest('SHA-256',bytes));if(sha!==expected)throw new Error(`SHA256 mismatch expected=${expected} actual=${sha}`);
 const root=await new Promise((resolve,reject)=>new GLTFLoader().parse(bytes,'',g=>resolve(g.scene),reject));scene.add(root);root.updateMatrixWorld(true);const box=new THREE.Box3().setFromObject(root),center=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3()),spec=defs[view]||defs.front,dir=new THREE.Vector3(...spec.dir).normalize(),up=new THREE.Vector3(...spec.up).normalize();let camera;if(spec.ortho){camera=new THREE.OrthographicCamera(-1,1,1,-1,.01,10);camera.position.copy(center).add(dir.multiplyScalar(2));camera.up.copy(up);camera.lookAt(center);fit(camera,box)}else{camera=new THREE.PerspectiveCamera(28,innerWidth/innerHeight,.01,20);camera.position.copy(center).add(dir.multiplyScalar(Math.max(size.x,size.y,size.z)*2.35));camera.up.copy(up);camera.lookAt(center)}renderer.render(scene,camera);
 window.__loadEvidence={engine:'Three.js GLTFLoader.parse',run:Number(run),model:variant,filename,view,expected_sha256:expected,observed_sha256:sha,byte_length:bytes.byteLength,node_count:[...root.children].length,status:'PASS'};Object.assign(document.body.dataset,{ready:'1',sha256:sha,model:variant,view,run,status:'PASS'});label.textContent=`PASS · Three.js · load ${run}/40 · ${variant} · ${view} · ${bytes.byteLength} bytes · SHA-256 ${sha}`;document.title=`PASS Three ${variant} ${view} ${run}`;
}catch(error){window.__loadEvidence={engine:'Three.js GLTFLoader.parse',run:Number(run),model:variant,filename,view,expected_sha256:expected,status:'FAIL',error:String(error)};Object.assign(document.body.dataset,{error:String(error),status:'FAIL'});label.textContent=`FAIL · ${error}`;document.title='FAIL Three';console.error(error)}
</script></body></html>
