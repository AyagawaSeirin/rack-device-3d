<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Babylon revalidation</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background-color:#d8dadd;background-image:linear-gradient(45deg,#c5c8cc 25%,transparent 25%),linear-gradient(-45deg,#c5c8cc 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#c5c8cc 75%),linear-gradient(-45deg,transparent 75%,#c5c8cc 75%);background-size:32px 32px;background-position:0 0,0 16px,16px -16px,-16px 0}canvas{display:block;width:100%;height:100%;touch-action:none}#label{position:fixed;left:14px;top:12px;z-index:2;max-width:calc(100vw - 48px);padding:8px 10px;border-radius:5px;background:rgba(255,255,255,.94);color:#182028;font:600 12px/1.35 ui-monospace,monospace;overflow-wrap:anywhere}
</style></head><body><div id="label">initializing</div><canvas id="renderCanvas"></canvas><script src="https://cdn.babylonjs.com/babylon.js"></script><script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
<script>
(async()=>{const params=new URLSearchParams(location.search),view=params.get('view')||'front',variant=params.get('model')==='standard'?'standard':'web',expected=params.get('expected')||'',run=params.get('run')||'0',filename=`Huawei-RH1288V5-3.5inch${variant==='web'?'-web':''}.glb`,label=document.getElementById('label'),hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
const defs={front:{dir:[0,0,1],up:[0,1,0],ortho:1},rear:{dir:[0,0,-1],up:[0,1,0],ortho:1},right:{dir:[1,0,0],up:[0,1,0],ortho:1},left:{dir:[-1,0,0],up:[0,1,0],ortho:1},top:{dir:[0,1,0],up:[0,0,-1],ortho:1},bottom:{dir:[0,-1,0],up:[0,0,-1],ortho:1},frontLeft:{dir:[-1.15,.58,1.35],up:[0,1,0]},frontRight:{dir:[1.15,.58,1.35],up:[0,1,0]},rearLeft:{dir:[-1.15,.58,-1.35],up:[0,1,0]},rearRight:{dir:[1.15,.58,-1.35],up:[0,1,0]}};
const canvas=document.getElementById('renderCanvas'),engine=new BABYLON.Engine(canvas,true,{preserveDrawingBuffer:true,stencil:true},false);engine.setHardwareScalingLevel(1);const scene=new BABYLON.Scene(engine);scene.clearColor=new BABYLON.Color4(0,0,0,0);scene.imageProcessingConfiguration.toneMappingEnabled=false;const hemi=new BABYLON.HemisphericLight('hemi',new BABYLON.Vector3(0,1,0),scene);hemi.intensity=1.55;hemi.groundColor=new BABYLON.Color3(.48,.5,.53);const key=new BABYLON.DirectionalLight('key',new BABYLON.Vector3(-.4,-.7,-.5),scene);key.position=new BABYLON.Vector3(2,3,4);key.intensity=1.2;
try{const response=await fetch(`/model/${filename}?revalidation=${encodeURIComponent(run)}&engine=babylon&view=${encodeURIComponent(view)}`,{cache:'no-store'});if(!response.ok)throw new Error(`HTTP ${response.status}`);const bytes=await response.arrayBuffer(),sha=hex(await crypto.subtle.digest('SHA-256',bytes));if(sha!==expected)throw new Error(`SHA256 mismatch expected=${expected} actual=${sha}`);const blobUrl=URL.createObjectURL(new Blob([bytes],{type:'model/gltf-binary'}));await BABYLON.SceneLoader.AppendAsync('',blobUrl,scene,undefined,'.glb');
let min=new BABYLON.Vector3(Infinity,Infinity,Infinity),max=new BABYLON.Vector3(-Infinity,-Infinity,-Infinity);for(const mesh of scene.meshes){if(!mesh.getTotalVertices())continue;mesh.computeWorldMatrix(true);const b=mesh.getBoundingInfo().boundingBox;min=BABYLON.Vector3.Minimize(min,b.minimumWorld);max=BABYLON.Vector3.Maximize(max,b.maximumWorld)}const center=min.add(max).scale(.5),size=max.subtract(min),spec=defs[view]||defs.front,dir=new BABYLON.Vector3(...spec.dir).normalize(),up=new BABYLON.Vector3(...spec.up).normalize(),camera=new BABYLON.FreeCamera('camera',center.add(dir.scale(2)),scene);camera.upVector=up;camera.setTarget(center);camera.minZ=.01;camera.maxZ=20;if(spec.ortho){camera.mode=BABYLON.Camera.ORTHOGRAPHIC_CAMERA;camera.computeWorldMatrix(true);const right=camera.getDirection(BABYLON.Axis.X).normalize(),trueUp=camera.getDirection(BABYLON.Axis.Y).normalize(),corners=[];for(const x of[min.x,max.x])for(const y of[min.y,max.y])for(const z of[min.z,max.z])corners.push(new BABYLON.Vector3(x,y,z).subtract(center));const xs=corners.map(p=>BABYLON.Vector3.Dot(p,right)),ys=corners.map(p=>BABYLON.Vector3.Dot(p,trueUp)),w=Math.max(...xs)-Math.min(...xs),h=Math.max(...ys)-Math.min(...ys),a=engine.getRenderWidth()/engine.getRenderHeight(),hh=Math.max(h/2,w/(2*a))*1.13;camera.orthoLeft=-hh*a;camera.orthoRight=hh*a;camera.orthoTop=hh;camera.orthoBottom=-hh}else{camera.fov=28*Math.PI/180;camera.position=center.add(dir.scale(Math.max(size.x,size.y,size.z)*2.35));camera.setTarget(center)}scene.activeCamera=camera;engine.resize();scene.render();engine.runRenderLoop(()=>scene.render());
window.__loadEvidence={engine:'Babylon.js SceneLoader.AppendAsync',run:Number(run),model:variant,filename,view,expected_sha256:expected,observed_sha256:sha,byte_length:bytes.byteLength,mesh_count:scene.meshes.length,status:'PASS'};Object.assign(document.body.dataset,{ready:'1',sha256:sha,model:variant,view,run,status:'PASS'});label.textContent=`PASS · Babylon.js · load ${run}/40 · ${variant} · ${view} · ${bytes.byteLength} bytes · SHA-256 ${sha}`;document.title=`PASS Babylon ${variant} ${view} ${run}`;
}catch(error){window.__loadEvidence={engine:'Babylon.js SceneLoader.AppendAsync',run:Number(run),model:variant,filename,view,expected_sha256:expected,status:'FAIL',error:String(error)};Object.assign(document.body.dataset,{error:String(error),status:'FAIL'});label.textContent=`FAIL · ${error}`;document.title='FAIL Babylon';console.error(error)}})();
</script></body></html>
