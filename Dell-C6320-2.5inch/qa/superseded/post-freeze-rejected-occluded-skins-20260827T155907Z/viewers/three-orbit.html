renderer.setPixelRatio(1);renderer.setSize(innerWidth,innerHeight,false);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.NoToneMapping;renderer.setClearColor(0x000000,0);document.body.appendChild(renderer.domElement);
const gl=renderer.getContext();if(!renderer.capabilities.isWebGL2)throw new Error("WebGL2 required");
