<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>HPE DL360 Gen9 4LFF — Three.js QA</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #dfe3e6; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
  <script type="importmap">
  { "imports": { "three": "../../node_modules/three/build/three.module.js" } }
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "../../node_modules/three/examples/jsm/loaders/GLTFLoader.js";

const WIDTH = 1600, HEIGHT = 1200, ASPECT = WIDTH / HEIGHT;
const query = new URLSearchParams(location.search);
const modelUrl = query.get("model") || "../../model/HPE-DL360G9-3.5inch.glb";
let view = query.get("view") || "front";
const background = query.get("background") || "neutral";

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(WIDTH, HEIGHT, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(background === "dark" ? 0x25282b : 0xdfe3e6);
scene.add(new THREE.HemisphereLight(0xffffff, 0x697079, 2.05));
const key = new THREE.DirectionalLight(0xffffff, 1.45); key.position.set(-2.5, 3.5, 4); scene.add(key);
const fill = new THREE.DirectionalLight(0xffffff, 0.62); fill.position.set(3, 1, -3); scene.add(fill);

const orthographic = {
  front: { dir:[0,0,1], up:[0,1,0], axes:["x","y"] },
  rear: { dir:[0,0,-1], up:[0,1,0], axes:["x","y"] },
  left: { dir:[-1,0,0], up:[0,1,0], axes:["z","y"] },
  right: { dir:[1,0,0], up:[0,1,0], axes:["z","y"] },
  top: { dir:[0,1,0], up:[0,0,-1], axes:["x","z"] },
  bottom: { dir:[0,-1,0], up:[0,0,-1], axes:["x","z"] }
};
const perspective = {
  "front-left":[-1.0,0.62,1.15], "front-right":[1.0,0.62,1.15],
  "rear-left":[-1.0,0.62,-1.15], "rear-right":[1.0,0.62,-1.15],
  "source-front-high":[0.0,0.20,1.0],
  "source-rear-high":[0.0,0.20,-1.0],
  "source-front-low":[0.0,0.06,1.0]
};

function cameraFor(center, size) {
  if (orthographic[view]) {
    const spec=orthographic[view], pw=size[spec.axes[0]], ph=size[spec.axes[1]];
    const halfH=Math.max(ph*0.58, pw/ASPECT*0.58), halfW=halfH*ASPECT;
    const camera=new THREE.OrthographicCamera(-halfW,halfW,halfH,-halfH,0.01,20);
    camera.position.copy(center).addScaledVector(new THREE.Vector3(...spec.dir),2);
    camera.up.set(...spec.up); camera.lookAt(center); camera.updateProjectionMatrix(); return camera;
  }
  const camera=new THREE.PerspectiveCamera(28,ASPECT,0.01,20);
  const dir=new THREE.Vector3(...(perspective[view]||perspective["front-left"])).normalize();
  const radius=Math.max(size.x,size.y,size.z)*0.5;
  camera.position.copy(center).addScaledVector(dir,radius/Math.tan(THREE.MathUtils.degToRad(14))*1.18);
  camera.up.set(0,1,0); camera.lookAt(center); camera.updateProjectionMatrix(); return camera;
}

new GLTFLoader().load(modelUrl, gltf => {
  scene.add(gltf.scene); gltf.scene.updateMatrixWorld(true);
  const bounds=new THREE.Box3().setFromObject(gltf.scene), center=bounds.getCenter(new THREE.Vector3()), size=bounds.getSize(new THREE.Vector3());
  let camera=cameraFor(center,size);
  window.qaLoadedModel=modelUrl;
  window.qaSetView=nextView=>{
    view=nextView;
    camera=cameraFor(center,size);
    renderer.render(scene,camera);
    return {view,model:modelUrl};
  };
  renderer.render(scene,camera);
  requestAnimationFrame(()=>{renderer.render(scene,camera);requestAnimationFrame(()=>{renderer.render(scene,camera);window.qaReady=true;document.body.dataset.ready="true";});});
}, undefined, error => { console.error(error); window.qaError=String(error); });
</script>
</body>
</html>
