<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Babylon.js WebGL2 orbit QA</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background-color:#d7dbe0;background-image:linear-gradient(45deg,#9fa6ad 25%,transparent 25%),linear-gradient(-45deg,#9fa6ad 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#9fa6ad 75%),linear-gradient(-45deg,transparent 75%,#9fa6ad 75%);background-size:40px 40px;background-position:0 0,0 20px,20px -20px,-20px 0}
    canvas{display:block;width:960px;height:720px;outline:none}
    #loading{position:fixed;inset:0;display:grid;place-items:center;background:#252a30;color:white;font:16px ui-monospace,monospace;z-index:5}
    #loading[hidden]{display:none!important}
  </style>
</head>
<body>
<div id="loading">BABYLON_LOADING</div><canvas id="renderCanvas" width="960" height="720"></canvas>
<script src="/HPE-DL360G10-3.5inch/node_modules/babylonjs/babylon.js"></script>
<script src="/HPE-DL360G10-3.5inch/node_modules/babylonjs-loaders/babylonjs.loaders.min.js"></script>
<script>
const params=new URLSearchParams(location.search),modelUrl=params.get("model"),initialYaw=Number(params.get("yaw")||0),initialPitch=Number(params.get("pitch")||0),WIDTH=960,HEIGHT=720,ASPECT=WIDTH/HEIGHT;
if(!modelUrl)throw new Error("model query parameter is required");
const canvas=document.getElementById("renderCanvas"),engine=new BABYLON.Engine(canvas,true,{preserveDrawingBuffer:true,stencil:true,alpha:true},true);engine.setSize(WIDTH,HEIGHT);BABYLON.SceneLoader.ShowLoadingScreen=false;
const scene=new BABYLON.Scene(engine);scene.useRightHandedSystem=true;scene.clearColor=new BABYLON.Color4(0,0,0,0);scene.imageProcessingConfiguration.toneMappingEnabled=false;scene.imageProcessingConfiguration.exposure=1;scene.imageProcessingConfiguration.contrast=1;
const hemi=new BABYLON.HemisphericLight("hemi",new BABYLON.Vector3(-.4,1,.6),scene);hemi.intensity=1.35;hemi.groundColor=new BABYLON.Color3(.45,.48,.50);
const key=new BABYLON.DirectionalLight("key",new BABYLON.Vector3(.4,-.8,-.7),scene);key.intensity=1.0;const fill=new BABYLON.DirectionalLight("fill",new BABYLON.Vector3(-.7,-.2,.7),scene);fill.intensity=.42;
const camera=new BABYLON.FreeCamera("qa-camera",new BABYLON.Vector3(0,0,2),scene);camera.mode=BABYLON.Camera.ORTHOGRAPHIC_CAMERA;camera.minZ=.01;camera.maxZ=10;scene.activeCamera=camera;
let min,max,center,corners,fixedHalfWidth,fixedHalfHeight;
function orbitDirection(yaw,pitch){const y=yaw*Math.PI/180,p=pitch*Math.PI/180,c=Math.cos(p);return new BABYLON.Vector3(Math.sin(y)*c,Math.sin(p),Math.cos(y)*c).normalize()}
function fitOrbit(yaw,pitch){
  const dir=orbitDirection(yaw,pitch),forward=dir.scale(-1),right=BABYLON.Vector3.Cross(forward,BABYLON.Axis.Y).normalize(),up=BABYLON.Vector3.Cross(right,forward).normalize();
  camera.position=center.add(dir.scale(2));camera.upVector=up;camera.setTarget(center);camera.orthoLeft=-fixedHalfWidth;camera.orthoRight=fixedHalfWidth;camera.orthoTop=fixedHalfHeight;camera.orthoBottom=-fixedHalfHeight;camera.minZ=.01;camera.maxZ=10;
}
async function renderOrbit(yaw,pitch){fitOrbit(Number(yaw),Number(pitch));scene.render();await new Promise(requestAnimationFrame);scene.render();await new Promise(requestAnimationFrame);return {yaw:Number(yaw),pitch:Number(pitch)}}
window.qaSetOrbit=renderOrbit;
BABYLON.SceneLoader.AppendAsync("",modelUrl,scene).then(async()=>{
  const ext=scene.getWorldExtends(mesh=>mesh.isEnabled()&&mesh.getTotalVertices()>0);min=ext.min;max=ext.max;center=min.add(max).scale(.5);corners=[];for(const x of [min.x,max.x])for(const y of [min.y,max.y])for(const z of [min.z,max.z])corners.push(new BABYLON.Vector3(x,y,z));const size=max.subtract(min);fixedHalfWidth=Math.hypot(size.x,size.z)*.55;fixedHalfHeight=fixedHalfWidth/ASPECT;
  await renderOrbit(initialYaw,initialPitch);document.getElementById("loading").hidden=true;window.qaInfo={engine:"Babylon.js 8.22.2",webgl2:engine.webGLVersion===2,model:modelUrl,bounds:{min:min.asArray(),max:max.asArray(),size:max.subtract(min).asArray()},near:camera.minZ,far:camera.maxZ,loadingOverlayHidden:document.getElementById("loading").hidden};window.qaReady=true;document.body.dataset.ready="true";
}).catch(error=>{window.qaError=String(error);document.getElementById("loading").textContent=`BABYLON_ERROR ${error}`});
</script>
</body>
</html>
