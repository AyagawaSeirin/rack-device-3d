<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Babylon.js rotation stress viewer</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background-color:#e3e5e8;background-image:linear-gradient(45deg,#c9cdd2 25%,transparent 25%),linear-gradient(-45deg,#c9cdd2 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#c9cdd2 75%),linear-gradient(-45deg,transparent 75%,#c9cdd2 75%);background-size:32px 32px;background-position:0 0,0 16px,16px -16px,-16px 0}body.dark{background-color:#30343a;background-image:linear-gradient(45deg,#181b20 25%,transparent 25%),linear-gradient(-45deg,#181b20 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#181b20 75%),linear-gradient(-45deg,transparent 75%,#181b20 75%)}canvas{display:block;width:100%;height:100%;touch-action:none}#label{position:fixed;left:12px;top:10px;padding:5px 8px;background:#ffffffe8;color:#20252a;font:600 12px/1.2 system-ui;border-radius:3px;z-index:2}</style></head>
<body><div id="label">Babylon.js rotation stress</div><canvas id="renderCanvas"></canvas><script src="./vendor/babylon.js"></script><script src="./vendor/babylonjs.loaders.min.js"></script><script>
(async()=>{
const params=new URLSearchParams(location.search),file=params.get('file');if(!file)throw new Error('missing ?file=/model/name.glb');
const canvas=document.getElementById('renderCanvas'),engine=new BABYLON.Engine(canvas,true,{preserveDrawingBuffer:true,stencil:true},false);engine.setHardwareScalingLevel(1);BABYLON.SceneLoader.ShowLoadingScreen=false;
const scene=new BABYLON.Scene(engine);scene.useRightHandedSystem=true;scene.clearColor=new BABYLON.Color4(0,0,0,0);scene.imageProcessingConfiguration.toneMappingEnabled=false;
const hemi=new BABYLON.HemisphericLight('hemi',new BABYLON.Vector3(0,1,0),scene);hemi.intensity=1.65;hemi.groundColor=new BABYLON.Color3(.47,.49,.52);
const key=new BABYLON.DirectionalLight('key',new BABYLON.Vector3(-.4,-.7,-.5),scene);key.position=new BABYLON.Vector3(2,3,4);key.intensity=1.2;
try{
  await BABYLON.SceneLoader.AppendAsync('',file,scene);await scene.whenReadyAsync();engine.hideLoadingUI();
  let min=new BABYLON.Vector3(Infinity,Infinity,Infinity),max=new BABYLON.Vector3(-Infinity,-Infinity,-Infinity);
  for(const mesh of scene.meshes){if(!mesh.getTotalVertices())continue;mesh.computeWorldMatrix(true);const b=mesh.getBoundingInfo().boundingBox;min=BABYLON.Vector3.Minimize(min,b.minimumWorld);max=BABYLON.Vector3.Maximize(max,b.maximumWorld)}
  const center=min.add(max).scale(.5),size=max.subtract(min),radius=Math.sqrt(size.x*size.x+size.y*size.y+size.z*size.z)/2,distance=Math.max(radius/Math.sin(14*Math.PI/180)*1.12,Math.max(size.x,size.y,size.z)*1.4);
  const camera=new BABYLON.ArcRotateCamera('orbitCamera',Math.PI/2,Math.PI/2-18*Math.PI/180,distance,center,scene);camera.minZ=.005;camera.maxZ=20;camera.lowerRadiusLimit=distance*.35;camera.upperRadiusLimit=distance*3;camera.attachControl(canvas,true);scene.activeCamera=camera;
  function pose(yawDeg,pitchDeg,background='light'){camera.alpha=Math.PI/2-yawDeg*Math.PI/180;camera.beta=Math.PI/2-pitchDeg*Math.PI/180;camera.radius=distance;camera.target.copyFrom(center);document.body.classList.toggle('dark',background==='dark');scene.render();document.getElementById('label').textContent=`Babylon.js · yaw ${yawDeg}° · pitch ${pitchDeg}° · ${background}`;return{yawDeg,pitchDeg,background,alpha:camera.alpha,beta:camera.beta,radius:camera.radius,target:center.asArray()}}
  function materialMetrics(){return scene.materials.map(m=>({material:m.name,alpha:m.alpha,transparencyMode:m.transparencyMode,backFaceCulling:m.backFaceCulling,separateCullingPass:m.separateCullingPass,disableDepthWrite:m.disableDepthWrite}));}
  pose(0,18,'light');scene.render();engine.runRenderLoop(()=>scene.render());window.rotationQA={engine:'Babylon.js',file,setPose:pose,render:()=>scene.render(),materialMetrics,bounds:{min:min.asArray(),max:max.asArray(),size:size.asArray()},webgl2:engine.webGLVersion===2};document.body.dataset.ready='1';document.title='READY Babylon rotation';
}catch(error){document.body.dataset.error=String(error);document.title='ERROR Babylon rotation';console.error(error)}
})();addEventListener('resize',()=>engine.resize());
</script></body></html>
