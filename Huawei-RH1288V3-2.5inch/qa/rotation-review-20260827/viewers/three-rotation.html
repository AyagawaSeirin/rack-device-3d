<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Three.js rotation stress viewer</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden}
    body{background-color:#e3e5e8;background-image:linear-gradient(45deg,#c9cdd2 25%,transparent 25%),linear-gradient(-45deg,#c9cdd2 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#c9cdd2 75%),linear-gradient(-45deg,transparent 75%,#c9cdd2 75%);background-size:32px 32px;background-position:0 0,0 16px,16px -16px,-16px 0}
    body.dark{background-color:#30343a;background-image:linear-gradient(45deg,#181b20 25%,transparent 25%),linear-gradient(-45deg,#181b20 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#181b20 75%),linear-gradient(-45deg,transparent 75%,#181b20 75%)}
    canvas{display:block;width:100%;height:100%;touch-action:none}
    #label{position:fixed;left:12px;top:10px;padding:5px 8px;background:#ffffffe8;color:#20252a;font:600 12px/1.2 system-ui;border-radius:3px;z-index:2}
  </style>
</head>
<body><div id="label">Three.js rotation stress</div>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
<script type="module">
import * as THREE from './vendor/three.module.js';
import {GLTFLoader} from './vendor/GLTFLoader.js';
import {OrbitControls} from './vendor/OrbitControls.js';

const params=new URLSearchParams(location.search);
const file=params.get('file');
if(!file) throw new Error('missing ?file=/model/name.glb');
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true,powerPreference:'high-performance'});
renderer.setPixelRatio(1); renderer.setSize(innerWidth,innerHeight); renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.NoToneMapping; renderer.setClearColor(0x000000,0); document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xffffff,0x747980,2.0));
const key=new THREE.DirectionalLight(0xffffff,1.5); key.position.set(2,3,4); scene.add(key);
const fill=new THREE.DirectionalLight(0xffffff,.7); fill.position.set(-3,1,-2); scene.add(fill);
const camera=new THREE.PerspectiveCamera(28,innerWidth/innerHeight,.005,20);
const controls=new OrbitControls(camera,renderer.domElement); controls.enableDamping=false; controls.enablePan=true; controls.enableZoom=true;
let center=new THREE.Vector3(),distance=2,root=null;
function pose(yawDeg,pitchDeg,background='light'){
  const yaw=THREE.MathUtils.degToRad(yawDeg),pitch=THREE.MathUtils.degToRad(pitchDeg),horizontal=distance*Math.cos(pitch);
  camera.position.set(center.x+horizontal*Math.sin(yaw),center.y+distance*Math.sin(pitch),center.z+horizontal*Math.cos(yaw));
  camera.up.set(0,1,0); controls.target.copy(center); camera.lookAt(center); controls.update();
  document.body.classList.toggle('dark',background==='dark'); renderer.render(scene,camera);
  document.getElementById('label').textContent=`Three.js · yaw ${yawDeg}° · pitch ${pitchDeg}° · ${background}`;
  return {yawDeg,pitchDeg,background,camera:camera.position.toArray(),target:center.toArray()};
}
function materialMetrics(){
  const rows=[]; root.traverse(o=>{if(!o.isMesh)return;for(const material of (Array.isArray(o.material)?o.material:[o.material])) rows.push({mesh:o.name,material:material?.name||'',transparent:!!material?.transparent,opacity:material?.opacity,alphaTest:material?.alphaTest,depthWrite:material?.depthWrite,side:material?.side});});
  return rows;
}
new GLTFLoader().load(file,async gltf=>{
  root=gltf.scene; scene.add(root); root.updateMatrixWorld(true);
  const box=new THREE.Box3().setFromObject(root),size=box.getSize(new THREE.Vector3()); center=box.getCenter(new THREE.Vector3());
  const radius=new THREE.Sphere(); box.getBoundingSphere(radius); distance=Math.max(radius.radius/Math.sin(THREE.MathUtils.degToRad(camera.fov/2))*1.12,Math.max(size.x,size.y,size.z)*1.4);
  controls.minDistance=distance*.35; controls.maxDistance=distance*3; pose(0,18,'light');
  await renderer.compileAsync(scene,camera); renderer.render(scene,camera);
  window.rotationQA={engine:'Three.js',file,setPose:pose,render:()=>renderer.render(scene,camera),materialMetrics,bounds:{min:box.min.toArray(),max:box.max.toArray(),size:size.toArray()},webgl2:renderer.capabilities.isWebGL2};
  document.body.dataset.ready='1'; document.title='READY Three rotation';
},undefined,error=>{document.body.dataset.error=String(error);document.title='ERROR Three rotation';console.error(error)});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);if(root)renderer.render(scene,camera)});
</script></body></html>
