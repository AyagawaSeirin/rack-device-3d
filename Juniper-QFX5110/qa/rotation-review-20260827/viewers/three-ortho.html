<script type="module">

const model=new URLSearchParams(location.search).get('model');if(!model)throw new Error('missing model');
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true,powerPreference:'high-performance'});renderer.setPixelRatio(1);renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.NoToneMapping;renderer.setClearColor(0,0);document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.add(new THREE.HemisphereLight(0xffffff,0x59616a,1.85));const key=new THREE.DirectionalLight(0xffffff,1.55);key.position.set(2,3,4);scene.add(key);const fill=new THREE.DirectionalLight(0xdde8ff,.65);fill.position.set(-3,1,-2);scene.add(fill);
