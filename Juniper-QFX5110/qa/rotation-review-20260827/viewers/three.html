<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Three.js WebGL2 rotation stress viewer</title>
  <style>
    html,body{width:100%;height:100%;margin:0;overflow:hidden}
    body.light{background-color:#d9dde1;background-image:linear-gradient(45deg,#f7f8f9 25%,transparent 25%),linear-gradient(-45deg,#f7f8f9 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#f7f8f9 75%),linear-gradient(-45deg,transparent 75%,#f7f8f9 75%);background-size:32px 32px;background-position:0 0,0 16px,16px -16px,-16px 0}
    body.dark{background-color:#202428;background-image:linear-gradient(45deg,#41474d 25%,transparent 25%),linear-gradient(-45deg,#41474d 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#41474d 75%),linear-gradient(-45deg,transparent 75%,#41474d 75%);background-size:32px 32px;background-position:0 0,0 16px,16px -16px,-16px 0}
    canvas{display:block;width:100%;height:100%;touch-action:none}
  </style>
  <script type="importmap">{"imports":{"three":"/Juniper-MX304/qa/viewers/vendor/three.module.min.js"}}</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from '/Juniper-MX304/qa/viewers/vendor/GLTFLoader.js';

const query=new URLSearchParams(location.search);
const model=query.get('model');
if(!model) throw new Error('missing ?model=/absolute/server/path.glb');
document.body.className=query.get('bg')==='dark'?'dark':'light';
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true,powerPreference:'high-performance'});
renderer.setPixelRatio(1);renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.NoToneMapping;renderer.setClearColor(0,0);document.body.appendChild(renderer.domElement);
const gl=renderer.getContext();
if(!(gl instanceof WebGL2RenderingContext)) throw new Error('WebGL2 required');
const scene=new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xffffff,0x59616a,1.85));
const key=new THREE.DirectionalLight(0xffffff,1.55);key.position.set(2,3,4);scene.add(key);
const fill=new THREE.DirectionalLight(0xdde8ff,.65);fill.position.set(-3,1,-2);scene.add(fill);
let root,center,radius,camera,yaw=0,pitch=16,distance;

function updateCamera(){
  const yr=THREE.MathUtils.degToRad(yaw),pr=THREE.MathUtils.degToRad(pitch),cp=Math.cos(pr);
  camera.position.set(center.x+distance*Math.sin(yr)*cp,center.y+distance*Math.sin(pr),center.z+distance*Math.cos(yr)*cp);
  camera.up.set(0,1,0);camera.lookAt(center);camera.updateMatrixWorld(true);
}
function renderFrames(count=3){return new Promise(resolve=>{function frame(){updateCamera();renderer.render(scene,camera);if(--count>0)requestAnimationFrame(frame);else resolve()}requestAnimationFrame(frame)})}
function materialStatus(){const out=[];root.traverse(o=>{if(o.isMesh){const materials=Array.isArray(o.material)?o.material:[o.material];for(const m of materials)out.push({mesh:o.name,material:m.name,transparent:m.transparent,opacity:m.opacity,side:m.side,depthWrite:m.depthWrite,depthTest:m.depthTest,alphaTest:m.alphaTest})}});return out}

new GLTFLoader().load(model,async gltf=>{
  root=gltf.scene;scene.add(root);root.updateMatrixWorld(true);
  const box=new THREE.Box3().setFromObject(root);center=box.getCenter(new THREE.Vector3());radius=box.getBoundingSphere(new THREE.Sphere()).radius;distance=radius*3.15;
  camera=new THREE.PerspectiveCamera(34,innerWidth/innerHeight,Math.max(radius/100,.001),radius*30);
  await renderFrames(5);window.__READY=true;
  window.qaSetPose=async(yawDeg,pitchDeg)=>{yaw=((Number(yawDeg)%360)+360)%360;pitch=Math.max(-82,Math.min(82,Number(pitchDeg)));await renderFrames(3);return{yaw,pitch}};
  window.qaGetStatus=()=>({ready:true,engine:'Three.js',webgl:gl.getParameter(gl.VERSION),model,yaw,pitch,bounds:{min:box.min.toArray(),max:box.max.toArray()},materials:materialStatus()});
},undefined,error=>{window.__ERROR=String(error);console.error(error)});

let dragging=false,lastX=0,lastY=0;
renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});
renderer.domElement.addEventListener('pointermove',e=>{if(!dragging||!camera)return;yaw+=(e.clientX-lastX)*.35;pitch=Math.max(-82,Math.min(82,pitch+(e.clientY-lastY)*.25));lastX=e.clientX;lastY=e.clientY;renderFrames(1)});
renderer.domElement.addEventListener('pointerup',()=>{dragging=false});
renderer.domElement.addEventListener('wheel',e=>{if(!camera)return;e.preventDefault();distance=Math.max(radius*1.2,Math.min(radius*8,distance*Math.exp(e.deltaY*.001)));renderFrames(1)},{passive:false});
addEventListener('resize',()=>{if(!camera)return;renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderFrames(2)});
</script>
</body>
</html>
