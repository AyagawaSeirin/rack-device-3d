<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QFX5110 Three.js QA Viewer</title>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eef1f4}canvas{display:block;width:100%;height:100%}</style>
  <script type="importmap">
    {"imports":{"three":"https://unpkg.com/three@0.180.0/build/three.module.js"}}
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'https://unpkg.com/three@0.180.0/examples/jsm/loaders/GLTFLoader.js';

const params = new URLSearchParams(location.search);
const view = params.get('view') || 'front-right';
const model = params.get('model') || '../../model/Juniper-QFX5110.glb';
const dark = params.get('bg') === 'dark';
const checker = params.get('bg') === 'checker-light' || params.get('bg') === 'checker-dark';
const checkerDark = params.get('bg') === 'checker-dark';
if (checker) {
  const a = checkerDark ? '#22262a' : '#d9dde1';
  const b = checkerDark ? '#3b4147' : '#f5f7f8';
  document.body.style.backgroundColor = a;
  document.body.style.backgroundImage = `linear-gradient(45deg, ${b} 25%, transparent 25%),linear-gradient(-45deg, ${b} 25%, transparent 25%),linear-gradient(45deg, transparent 75%, ${b} 75%),linear-gradient(-45deg, transparent 75%, ${b} 75%)`;
  document.body.style.backgroundSize = '32px 32px';
  document.body.style.backgroundPosition = '0 0,0 16px,16px -16px,-16px 0px';
}

const renderer = new THREE.WebGLRenderer({antialias:true, alpha:checker, preserveDrawingBuffer:true});
renderer.setPixelRatio(1);
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
renderer.setClearColor(dark ? 0x25282c : 0xeef1f4, checker ? 0 : 1);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xffffff, 0x5f6872, 2.0));
const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(2,3,4); scene.add(key);
const fill = new THREE.DirectionalLight(0xffffff, 1.1); fill.position.set(-3,1,-2); scene.add(fill);

const loader = new GLTFLoader();
loader.load(model, (gltf) => {
  scene.add(gltf.scene);
  const box = new THREE.Box3().setFromObject(gltf.scene);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  const directions = {
    front:[0,0,1], rear:[0,0,-1], left:[-1,0,0], right:[1,0,0], top:[0,1,0], bottom:[0,-1,0],
    'front-left':[-1,0.55,1], 'front-right':[1,0.55,1], 'rear-left':[-1,0.55,-1], 'rear-right':[1,0.55,-1],
    'front-top':[0,0.24,1], 'front-left-shallow':[-0.20,0.16,1], 'front-right-shallow':[0.20,0.16,1], 'rear-top':[0,0.24,-1]
  };
  const d = new THREE.Vector3(...directions[view]).normalize();
  const up = view === 'top' ? new THREE.Vector3(0,0,-1) : (view === 'bottom' ? new THREE.Vector3(0,0,1) : new THREE.Vector3(0,1,0));
  const aspect = innerWidth / innerHeight;
  const shallow = ['front-top','front-left-shallow','front-right-shallow','rear-top'].includes(view);
  const axes = (view === 'front' || view === 'rear') ? [size.x,size.y] :
               (view === 'left' || view === 'right') ? [size.z,size.y] :
               (view === 'top' || view === 'bottom') ? [size.x,size.z] :
               shallow ? [size.x * 1.04, size.y + size.z * 0.25] :
               [Math.hypot(size.x,size.z), Math.max(size.y,Math.hypot(size.x,size.z)*0.72)];
  let halfW = axes[0] * 0.55;
  let halfH = axes[1] * 0.58;
  if (halfW / halfH < aspect) halfW = halfH * aspect; else halfH = halfW / aspect;
  const camera = new THREE.OrthographicCamera(-halfW,halfW,halfH,-halfH,0.01,20);
  camera.position.copy(center).addScaledVector(d, 2.0);
  camera.up.copy(up);
  camera.lookAt(center);
  camera.updateProjectionMatrix();
  renderer.render(scene,camera);
  window.__READY = true;
  window.__VIEW = view;
}, undefined, (error) => { window.__ERROR = String(error); });

addEventListener('resize', () => location.reload());
</script>
</body>
</html>
