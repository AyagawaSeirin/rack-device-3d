<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>R7525 Three.js QA Viewer</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#d9dde0}
    body{background-image:linear-gradient(45deg,#c7ccd0 25%,transparent 25%),linear-gradient(-45deg,#c7ccd0 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#c7ccd0 75%),linear-gradient(-45deg,transparent 75%,#c7ccd0 75%);background-size:40px 40px;background-position:0 0,0 20px,20px -20px,-20px 0}
    canvas{display:block;width:100%;height:100%}
    #status{position:fixed;left:12px;top:10px;padding:6px 9px;background:#111c;color:#fff;font:12px/1.3 sans-serif;border-radius:4px}
  </style>
</head>
<body><div id="status">loading</div><canvas id="c"></canvas>
<script type="module">
import * as THREE from './vendor/three.module.js';
import {GLTFLoader} from './vendor/GLTFLoader.js';

const params=new URLSearchParams(location.search);
const variant=params.get('model')==='web'?'web':'standard';
const view=params.get('view')||'front';
const modelFile=variant==='web'?'../../model/Dell-R7525-2.5inch-web.glb':'../../model/Dell-R7525-2.5inch.glb';
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(1);
renderer.setSize(innerWidth,innerHeight,false);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.NoToneMapping;
const scene=new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xffffff,0x59636c,2.2));
const key=new THREE.DirectionalLight(0xffffff,2.2); key.position.set(1.5,2.4,2.2); scene.add(key);
const fill=new THREE.DirectionalLight(0xdfeaff,1.2); fill.position.set(-2,0.7,-1.5); scene.add(fill);
const camera=new THREE.OrthographicCamera(-1,1,1,-1,0.01,10);

const cameras={
  front:{dir:[0,0,1],up:[0,1,0]},rear:{dir:[0,0,-1],up:[0,1,0]},
  left:{dir:[-1,0,0],up:[0,1,0]},right:{dir:[1,0,0],up:[0,1,0]},
  top:{dir:[0,1,0],up:[0,0,-1]},bottom:{dir:[0,-1,0],up:[0,0,-1]},
  front_left:{dir:[-1,0.55,1],up:[0,1,0]},front_right:{dir:[1,0.55,1],up:[0,1,0]},
  rear_left:{dir:[-1,0.55,-1],up:[0,1,0]},rear_right:{dir:[1,0.55,-1],up:[0,1,0]}
};
function fit(root,spec){
  const box=new THREE.Box3().setFromObject(root); const center=box.getCenter(new THREE.Vector3());
  const size=box.getSize(new THREE.Vector3()); const radius=size.length();
  const dir=new THREE.Vector3(...spec.dir).normalize(); camera.up.set(...spec.up).normalize();
  camera.position.copy(center).addScaledVector(dir,Math.max(2,radius*3)); camera.lookAt(center); camera.updateMatrixWorld(true);
  const pts=[]; for(const x of [box.min.x,box.max.x])for(const y of [box.min.y,box.max.y])for(const z of [box.min.z,box.max.z])pts.push(new THREE.Vector3(x,y,z).applyMatrix4(camera.matrixWorldInverse));
  const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y); const w=Math.max(...xs)-Math.min(...xs),h=Math.max(...ys)-Math.min(...ys); const aspect=innerWidth/innerHeight;
  const halfH=Math.max(h/2,w/(2*aspect))*1.12; camera.left=-halfH*aspect;camera.right=halfH*aspect;camera.top=halfH;camera.bottom=-halfH;camera.near=0.01;camera.far=10;camera.updateProjectionMatrix();
}
const started=performance.now();
new GLTFLoader().load(modelFile,g=>{
  scene.add(g.scene); fit(g.scene,cameras[view]||cameras.front); renderer.render(scene,camera);
  const nodes=[];g.scene.traverse(o=>nodes.push(o));
  window.__LOAD_EVIDENCE__={viewer:'three.js',variant,view,url:modelFile,loadMs:+(performance.now()-started).toFixed(2),nodeCount:nodes.length,renderer:renderer.info.render};
  document.getElementById('status').textContent=`Three.js · ${variant} · ${view}`; document.body.dataset.ready='1';
},undefined,e=>{document.body.dataset.error=String(e);document.getElementById('status').textContent='ERROR '+e;});
</script></body></html>
