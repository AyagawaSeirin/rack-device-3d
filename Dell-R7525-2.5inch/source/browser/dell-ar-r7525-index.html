  <body>
    <script>/* needle: fix for peerjs */ window.global = window; var parcelRequire;</script>

    <div
      id="hard-device-block"
      style="display: none"
      class="device-unsupported-overlay"
    >
      <div class="system-warning-modal">
        <div class="system-warning-header">
          <h2 id="popup-title" class="system-warning-title"></h2>
        </div>
        <div id="popup-body" class="system-warning-body"></div>

        <div class="system-warning-footer">
          <div
            id="ok-btn"
            class="flex-center btnPrimary textButton pointer system-warning-btn"
            tabindex="0"
            role="button"
          >
            OK
          </div>
        </div>
      </div>
    </div>
    <script>
      window.appConfigReady = new Promise((resolve) => {
        window._resolveAppConfig = resolve;
      });

      (async function () {
        function isWebGLSupported() {
          try {
            const canvas = document.createElement("canvas");
            return !!(
              window.WebGL2RenderingContext && canvas.getContext("webgl2")
            );
          } catch (e) {
            return false;
          }
        }

        async function fetchConfig(url) {
          const response = await fetch(url);
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return await response.json();
        }

        function hasCurrentInPath() {
          return document.location.pathname
            .split("/")
            .some((segment) => segment.includes("current"));
        }

        async function getConfig() {
          const CONFIG_URL = hasCurrentInPath()
            ? "../../webgl_config.json"
            : "../webgl_config.json";
          let data = null;

          try {
            data = await fetchConfig(CONFIG_URL);
          } catch (firstError) {
            console.warn(
              "[getConfig] First attempt failed, retrying...",
              firstError,
            );
            try {
              data = await fetchConfig(CONFIG_URL);
            } catch (secondError) {
              console.error(
                "[getConfig] Both attempts failed. Falling back to {}.",
                secondError,
              );
              data = {};
            }
          }

          window.appConfig = data;

          const searchParams = new URLSearchParams(window.location.search);
          const pid = searchParams.get("pid") || "";
          const langCode = pid ? pid.slice(-2).toUpperCase() : "EN";

          const langMap = {
            EN: 0,
            ZH: 1,
            DE: 2,
            ES: 3,
            FA: 4,
            JA: 5,
            PT: 6,
          };

          window.appConfig._langID = data?.isMultiLanguageEnabled
            ? (langMap[langCode] ?? 0)
            : 0;

          const selectedLang =
            data.translations.languageList[window.appConfig._langID];
          window.appConfig._strings = selectedLang || {};

          window._resolveAppConfig(window.appConfig);
        }

        await getConfig();

        if (!isWebGLSupported()) {
          const strings = window.appConfig._strings.data;
          const block = document.getElementById("hard-device-block");

          document.getElementById("popup-title").innerText =
            strings.deviceNotSupportedTitle || "";

          document.getElementById("popup-body").innerText =
            strings.deviceNotSupportedBody || "";

          document.getElementById("ok-btn").innerText = strings.ok || "OK";

          block.style.display = "flex";

          const root = document.getElementById("root");
          if (root) root.style.display = "none";

          const showPopup = () => {
            block.style.display = "flex";
          };

          document
            .getElementById("ok-btn")
            .addEventListener("click", showPopup);

          document
            .getElementById("ok-btn")
            .addEventListener("keydown", function (e) {
              if (e.key === "Enter" || e.key === " ") {
                showPopup();
              }
            });
        }
      })();
    </script>
    <script>
      (function () {
        const hasCurrent = location.pathname
          .split("/")
          .some((seg) => seg === "current");
        const cssPath = hasCurrent ? "../../override.css" : "../override.css";

        var lnk = document.createElement("link");
        lnk.href = cssPath;
        lnk.rel = "stylesheet";
        lnk.type = "text/css";

        document.body.insertAdjacentElement("afterbegin", lnk);
      })();
    </script>
    
    

    <div id="root"></div>
