<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Babylon.js SR655 24SFF QA</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #eef0f2; }
    #renderCanvas { width: 100%; height: 100%; display: block; touch-action: none; }
  </style>
</head>
<body>
<canvas id="renderCanvas"></canvas>
<script src="/qa/viewers/vendor/babylon.js"></script>
<script src="/qa/viewers/vendor/babylonjs.loaders.min.js"></script>
<script>
(async () => {
  const params = new URLSearchParams(location.search);
  const view = params.get('view') || 'front';
  const web = params.get('model') === 'web';
  const filename = `Lenovo-ThinkServer-SR655-2.5inch${web ? '-web' : ''}.glb`;
  const canvas = document.getElementById('renderCanvas');
  const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true }, false);
  engine.setHardwareScalingLevel(1);
  const scene = new BABYLON.Scene(engine);
  scene.clearColor = BABYLON.Color4.FromHexString('#eef0f2ff');
  scene.imageProcessingConfiguration.toneMappingEnabled = false;
  scene.imageProcessingConfiguration.exposure = 1.0;
  const hemi = new BABYLON.HemisphericLight('hemi', new BABYLON.Vector3(0, 1, 0), scene);
  hemi.intensity = 1.6;
  hemi.groundColor = new BABYLON.Color3(0.55, 0.58, 0.62);
  const key = new BABYLON.DirectionalLight('key', new BABYLON.Vector3(-0.4, -0.7, -0.5), scene);
  key.position = new BABYLON.Vector3(2, 3, 4);
  key.intensity = 1.4;

  const defs = {
    front:      { dir: [0, 0, 1],  up: [0, 1, 0], projected: [0.4820, 0.0865], ortho: true },
    rear:       { dir: [0, 0, -1], up: [0, 1, 0], projected: [0.4446, 0.0865], ortho: true },
    right:      { dir: [1, 0, 0],  up: [0, 1, 0], projected: [0.7647, 0.0865], ortho: true },
    left:       { dir: [-1, 0, 0], up: [0, 1, 0], projected: [0.7647, 0.0865], ortho: true },
    top:        { dir: [0, 1, 0],  up: [0, 0, 1], projected: [0.4820, 0.7647], ortho: true },
    bottom:     { dir: [0, -1, 0], up: [0, 0, 1], projected: [0.4820, 0.7647], ortho: true },
    frontRight: { dir: [1.15, 0.62, 1.35], up: [0, 1, 0], ortho: false },
    rearRight:  { dir: [1.12, 0.58, -1.35], up: [0, 1, 0], ortho: false },
  };

  try {
    await BABYLON.SceneLoader.AppendAsync('/model/', filename, scene);
    let min = new BABYLON.Vector3(Number.POSITIVE_INFINITY, Number.POSITIVE_INFINITY, Number.POSITIVE_INFINITY);
    let max = new BABYLON.Vector3(Number.NEGATIVE_INFINITY, Number.NEGATIVE_INFINITY, Number.NEGATIVE_INFINITY);
    scene.meshes.forEach((mesh) => {
      if (!mesh.getTotalVertices()) return;
      mesh.computeWorldMatrix(true);
      const bi = mesh.getBoundingInfo().boundingBox;
      min = BABYLON.Vector3.Minimize(min, bi.minimumWorld);
      max = BABYLON.Vector3.Maximize(max, bi.maximumWorld);
    });
    const center = min.add(max).scale(0.5);
    const size = max.subtract(min);
    const spec = defs[view] || defs.front;
    const dir = new BABYLON.Vector3(...spec.dir).normalize();
    const up = new BABYLON.Vector3(...spec.up).normalize();
    const camera = new BABYLON.FreeCamera('camera', center.add(dir.scale(2.0)), scene);
    camera.upVector = up;
    camera.setTarget(center);
    camera.minZ = 0.01;
    camera.maxZ = 20;
    if (spec.ortho) {
      camera.mode = BABYLON.Camera.ORTHOGRAPHIC_CAMERA;
      const aspect = engine.getRenderWidth() / engine.getRenderHeight();
      const halfH = Math.max(spec.projected[1] * 0.60, spec.projected[0] / aspect * 0.60);
      camera.orthoLeft = -halfH * aspect;
      camera.orthoRight = halfH * aspect;
      camera.orthoTop = halfH;
      camera.orthoBottom = -halfH;
    } else {
      camera.fov = 30 * Math.PI / 180;
      const distance = Math.max(size.x, size.y, size.z) * 2.3;
      camera.position = center.add(dir.scale(distance));
      camera.setTarget(center);
    }
    scene.activeCamera = camera;
    scene.render();
    engine.resize();
    scene.render();
    document.body.dataset.ready = '1';
    document.title = `READY Babylon ${web ? 'web' : 'standard'} ${view}`;
  } catch (error) {
    console.error(error);
    document.body.dataset.error = String(error);
    document.title = 'ERROR Babylon';
  }
  engine.runRenderLoop(() => scene.render());
})();
</script>
</body>
</html>
