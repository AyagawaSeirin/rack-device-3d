<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Babylon.js WebGL2 orbit gate</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#d8dadd}body.light{background-color:#e7e9eb;background-image:linear-gradient(45deg,#c9cdd1 25%,transparent 25%),linear-gradient(-45deg,#c9cdd1 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#c9cdd1 75%),linear-gradient(-45deg,transparent 75%,#c9cdd1 75%);background-size:32px 32px;background-position:0 0,0 16px,16px -16px,-16px 0}body.dark{background-color:#22262b;background-image:linear-gradient(45deg,#343a40 25%,transparent 25%),linear-gradient(-45deg,#343a40 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#343a40 75%),linear-gradient(-45deg,transparent 75%,#343a40 75%);background-size:32px 32px;background-position:0 0,0 16px,16px -16px,-16px 0}canvas{display:block;width:100%;height:100%;touch-action:none}#hud{position:fixed;left:12px;top:10px;z-index:2;padding:6px 8px;border-radius:3px;background:#ffffffe8;color:#171b1f;font:600 12px/1.35 ui-monospace,monospace;white-space:pre}
</style></head><body class="light"><div id="hud">initializing</div><canvas id="canvas"></canvas><script src="./vendor/babylon.js"></script><script src="./vendor/babylonjs.loaders.min.js"></script><script>
(async()=>{const params=new URLSearchParams(location.search),key=params.get('key')||'Lenovo-ThinkServer-SR655-3.5inch',variant=params.get('model')==='web'?'web':'standard',expectedHash=params.get('sha256')||'',loadId=params.get('load')||'interactive',canvas=document.getElementById('canvas'),hud=document.getElementById('hud');let yaw=Number(params.get('yaw')||0),pitch=Number(params.get('pitch')||12),radius=1,center=new BABYLON.Vector3(0,0,0);document.body.className=params.get('bg')==='dark'?'dark':'light';const engine=new BABYLON.Engine(canvas,true,{alpha:true,antialias:true,depth:true,preserveDrawingBuffer:true,stencil:true,disableWebGL2Support:false,premultipliedAlpha:true},false);if(engine.webGLVersion!==2)throw new Error(`Expected WebGL2, got ${engine.webGLVersion}`);engine.setHardwareScalingLevel(1);BABYLON.SceneLoader.ShowLoadingScreen=false;const scene=new BABYLON.Scene(engine);scene.useRightHandedSystem=true;scene.clearColor=new BABYLON.Color4(0,0,0,0);scene.imageProcessingConfiguration.toneMappingEnabled=false;scene.imageProcessingConfiguration.exposure=1;const hemi=new BABYLON.HemisphericLight('hemi',new BABYLON.Vector3(0,1,0),scene);hemi.intensity=1.45;hemi.groundColor=new BABYLON.Color3(.38,.41,.44);const light=new BABYLON.DirectionalLight('key',new BABYLON.Vector3(-.4,-.7,-.5),scene);light.position=new BABYLON.Vector3(2,3,4);light.intensity=1.15;const modelUrl=`/model/${key}${variant==='web'?'-web':''}.glb?load=${encodeURIComponent(loadId)}&sha256=${encodeURIComponent(expectedHash)}`;let camera;
function render(){scene.render();hud.textContent=`Babylon.js ${BABYLON.Engine.Version} · WebGL${engine.webGLVersion}\n${variant} · yaw ${yaw.toFixed(2)}° · pitch ${pitch.toFixed(2)}°\n${document.body.className} checker · ${expectedHash.slice(0,12)}`}
function setOrbit(nextYaw,nextPitch){yaw=((Number(nextYaw)%360)+360)%360;pitch=Math.max(-88,Math.min(88,Number(nextPitch)));const yr=BABYLON.Tools.ToRadians(yaw),pr=BABYLON.Tools.ToRadians(pitch),cp=Math.cos(pr);camera.setPosition(new BABYLON.Vector3(center.x+radius*cp*Math.sin(yr),center.y+radius*Math.sin(pr),center.z+radius*cp*Math.cos(yr)));camera.setTarget(center);render();return{yaw,pitch,radius}}
function setBackground(name){document.body.className=name==='dark'?'dark':'light';render();return document.body.className}
async function startRotation(durationMs=7200,rotationPitch=12){document.body.dataset.done='0';const samples=[],start=performance.now();return await new Promise(resolve=>{function frame(now){const elapsed=Math.max(0,Math.min(durationMs,now-start)),angle=elapsed/durationMs*360;setOrbit(angle,rotationPitch);samples.push({elapsed_ms:Number(elapsed.toFixed(3)),yaw_deg:Number(angle.toFixed(4)),pitch_deg:Number(rotationPitch)});if(elapsed>=durationMs){document.body.dataset.done='1';resolve({duration_ms:durationMs,animation_frames:samples.length,samples})}else requestAnimationFrame(frame)}requestAnimationFrame(frame)})}
window.qaSetOrbit=setOrbit;window.qaSetBackground=setBackground;window.qaStartRotation=startRotation;
try{await BABYLON.SceneLoader.AppendAsync('/model/',`${key}${variant==='web'?'-web':''}.glb?load=${encodeURIComponent(loadId)}&sha256=${encodeURIComponent(expectedHash)}`,scene);let min=new BABYLON.Vector3(Infinity,Infinity,Infinity),max=new BABYLON.Vector3(-Infinity,-Infinity,-Infinity);for(const mesh of scene.meshes){if(!mesh.getTotalVertices())continue;mesh.computeWorldMatrix(true);const box=mesh.getBoundingInfo().boundingBox;min=BABYLON.Vector3.Minimize(min,box.minimumWorld);max=BABYLON.Vector3.Maximize(max,box.maximumWorld)}center=min.add(max).scale(.5);const size=max.subtract(min),maxExtent=Math.max(size.x,size.y,size.z);radius=maxExtent*2.35;camera=new BABYLON.ArcRotateCamera('OrbitCamera',Math.PI/2,Math.PI/2,radius,center,scene);camera.minZ=Math.max(.001,maxExtent/500);camera.maxZ=maxExtent*20;camera.fov=30*Math.PI/180;camera.lowerRadiusLimit=maxExtent*.8;camera.upperRadiusLimit=maxExtent*8;camera.panningSensibility=0;camera.wheelPrecision=80;camera.attachControl(canvas,true);scene.activeCamera=camera;setOrbit(yaw,pitch);window.qaState=()=>({engine:'babylon',engine_revision:BABYLON.Engine.Version,webgl_version:engine.webGLVersion,variant,key,expected_sha256:expectedHash,model_url:modelUrl,load_id:loadId,yaw,pitch,radius,bounds:[size.x,size.y,size.z],background:document.body.className});engine.runRenderLoop(()=>scene.render());addEventListener('resize',()=>engine.resize());document.body.dataset.ready='1';document.body.dataset.done='0';document.title=`READY Babylon ${variant} ${loadId}`}catch(error){document.body.dataset.error=String(error);document.title='ERROR Babylon';console.error(error)}})();
</script></body></html>
