<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Juniper MX304 Babylon.js QA Viewer</title>
  <style>html,body,canvas{width:100%;height:100%;margin:0;overflow:hidden;display:block}</style>
</head>
<body>
<canvas id="viewer"></canvas>
<script src="./vendor/babylon.js"></script>
<script src="./vendor/babylonjs.loaders.min.js"></script>
<script>
(async function () {
  const params = new URLSearchParams(location.search);
  const view = params.get('view') || 'front';
  const modelURL = params.get('model') || '../../model/Juniper-MX304.glb';
  const hex = (params.get('bg') || 'eef0f2').replace('#', '');
  const rgb = [0,2,4].map((index) => parseInt(hex.slice(index,index+2),16)/255);
  const vectors = {
    front: [[0,0,1],[0,1,0]], rear: [[0,0,-1],[0,1,0]],
    right: [[1,0,0],[0,1,0]], left: [[-1,0,0],[0,1,0]],
    top: [[0,1,0],[0,0,-1]], bottom: [[0,-1,0],[0,0,1]],
    front_top: [[0,0.62,1.35],[0,1,0]],
    front_left: [[-0.9,0.55,1.1],[0,1,0]], front_right: [[0.9,0.55,1.1],[0,1,0]],
    rear_left: [[-0.9,0.55,-1.1],[0,1,0]], rear_right: [[0.9,0.55,-1.1],[0,1,0]]
  };
  const canvas = document.getElementById('viewer');
  const engine = new BABYLON.Engine(canvas, true, {preserveDrawingBuffer:true, stencil:true}, false);
  engine.setSize(innerWidth, innerHeight);
  const scene = new BABYLON.Scene(engine);
  scene.useRightHandedSystem = true;
  scene.clearColor = new BABYLON.Color4(rgb[0],rgb[1],rgb[2],1);
  scene.imageProcessingConfiguration.toneMappingEnabled = false;
  scene.imageProcessingConfiguration.exposure = 1;
  scene.imageProcessingConfiguration.contrast = 1;
  const hemi = new BABYLON.HemisphericLight('hemisphere', new BABYLON.Vector3(0,1,0), scene);
  hemi.intensity = 1.25; hemi.groundColor = new BABYLON.Color3(0.48,0.51,0.54);
  const key = new BABYLON.DirectionalLight('key', new BABYLON.Vector3(-1,-1.2,-1.4), scene);
  key.intensity = 1.35;
  await BABYLON.SceneLoader.AppendAsync('', modelURL, scene);
  for (const material of scene.materials) {
    if (material.name && material.name.includes('photo material')) {
      material.backFaceCulling = false;
      material.twoSidedLighting = true;
    }
  }
  const extents = scene.getWorldExtends((mesh) => mesh.getTotalVertices && mesh.getTotalVertices() > 0);
  const min = extents.min, max = extents.max;
  const center = min.add(max).scale(0.5);
  const setting = vectors[view] || vectors.front;
  const direction = new BABYLON.Vector3(...setting[0]).normalize();
  const up = new BABYLON.Vector3(...setting[1]).normalize();
  const camera = new BABYLON.FreeCamera('orthographic', center.add(direction.scale(2)), scene);
  camera.upVector = up;
  camera.setTarget(center);
  camera.mode = BABYLON.Camera.ORTHOGRAPHIC_CAMERA;
  const forward = center.subtract(camera.position).normalize();
  const right = BABYLON.Vector3.Cross(forward, up).normalize();
  const actualUp = BABYLON.Vector3.Cross(right, forward).normalize();
  let halfWidth = 0, halfHeight = 0;
  for (const x of [min.x,max.x]) for (const y of [min.y,max.y]) for (const z of [min.z,max.z]) {
    const delta = new BABYLON.Vector3(x,y,z).subtract(center);
    halfWidth = Math.max(halfWidth, Math.abs(BABYLON.Vector3.Dot(delta,right)));
    halfHeight = Math.max(halfHeight, Math.abs(BABYLON.Vector3.Dot(delta,actualUp)));
  }
  halfWidth *= 1.10; halfHeight *= 1.10;
  const aspect = innerWidth / innerHeight;
  if (halfWidth / halfHeight < aspect) halfWidth = halfHeight * aspect;
  else halfHeight = halfWidth / aspect;
  camera.orthoLeft = -halfWidth; camera.orthoRight = halfWidth;
  camera.orthoTop = halfHeight; camera.orthoBottom = -halfHeight;
  scene.activeCamera = camera;
  scene.render();
  await new Promise((resolve) => setTimeout(resolve, 250));
  scene.render();
  document.body.dataset.ready = 'true';
  window.__qaReady = true;
})().catch((error) => {
  document.body.dataset.error = String(error);
  console.error(error);
});
</script>
</body>
</html>
