<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Three.js R7515 QA Viewer</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background-color:#b9bec2;background-image:linear-gradient(45deg,#f4f5f6 25%,transparent 25%),linear-gradient(-45deg,#f4f5f6 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#2d3236 75%),linear-gradient(-45deg,transparent 75%,#2d3236 75%);background-size:48px 48px;background-position:0 0,0 24px,24px -24px,-24px 0}
    canvas{display:block;width:100%;height:100%}
    #status{position:fixed;left:12px;top:12px;z-index:2;padding:8px 11px;border-radius:6px;background:#101418dc;color:#eaf2f6;font:12px/1.35 system-ui,sans-serif;white-space:pre}
  </style>
  <script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js"}}</script>
</head>
<body>
<div id="status">LOADING</div>
<canvas id="canvas"></canvas>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from '/node_modules/three/examples/jsm/loaders/GLTFLoader.js';

const params=new URLSearchParams(location.search);
const model=params.get('model')||'standard';
const view=params.get('view')||'front';
const qaId=params.get('qa')||crypto.randomUUID();
const file=model==='web'?'Dell-R7515-3.5inch-web.glb':'Dell-R7515-3.5inch.glb';
const modelUrl=`/model/${file}?qa=${encodeURIComponent(qaId)}`;
const status=document.getElementById('status');
const canvas=document.getElementById('canvas');
const renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(1);
renderer.setSize(innerWidth,innerHeight,false);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.NoToneMapping;
renderer.setClearColor(0x000000,0);
const scene=new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xffffff,0x3c4650,2.0));
const key=new THREE.DirectionalLight(0xffffff,2.2);key.position.set(1.5,2.5,2.0);scene.add(key);
const fill=new THREE.DirectionalLight(0xdcecff,1.0);fill.position.set(-2,1,-2);scene.add(fill);

function cameraFor(box){
  const size=new THREE.Vector3();box.getSize(size);const center=new THREE.Vector3();box.getCenter(center);
  const aspect=innerWidth/innerHeight;const max=Math.max(size.x,size.y,size.z);let camera;
  const orthos={front:[new THREE.Vector3(0,0,1),size.x,size.y,new THREE.Vector3(0,1,0)],rear:[new THREE.Vector3(0,0,-1),size.x,size.y,new THREE.Vector3(0,1,0)],left:[new THREE.Vector3(-1,0,0),size.z,size.y,new THREE.Vector3(0,1,0)],right:[new THREE.Vector3(1,0,0),size.z,size.y,new THREE.Vector3(0,1,0)],top:[new THREE.Vector3(0,1,0),size.x,size.z,new THREE.Vector3(0,0,-1)],bottom:[new THREE.Vector3(0,-1,0),size.x,size.z,new THREE.Vector3(0,0,1)]};
  if(orthos[view]){const [dir,w,h,up]=orthos[view];const halfH=Math.max(h*0.62,w/aspect*0.62);camera=new THREE.OrthographicCamera(-halfH*aspect,halfH*aspect,halfH,-halfH,0.001,10);camera.position.copy(center).addScaledVector(dir,max*2.4);camera.up.copy(up);camera.lookAt(center);}
  else if(view==='front-logo'||view==='rear-psu'){const front=view==='front-logo';const target=front?new THREE.Vector3(0.155,-0.028,box.max.z):new THREE.Vector3(-0.167,0,box.min.z);const halfH=front?0.052:0.066;camera=new THREE.OrthographicCamera(-halfH*aspect,halfH*aspect,halfH,-halfH,0.001,10);camera.position.copy(target).add(new THREE.Vector3(0,0,front?max*1.7:-max*1.7));camera.up.set(0,1,0);camera.lookAt(target);}
  else{const dirs={'front-left':[-1,0.46,1],'front-right':[1,0.46,1],'rear-left':[-1,0.46,-1],'rear-right':[1,0.46,-1]};const dir=new THREE.Vector3(...(dirs[view]||dirs['front-left'])).normalize();camera=new THREE.PerspectiveCamera(29,aspect,0.001,10);camera.position.copy(center).addScaledVector(dir,max*2.15);camera.up.set(0,1,0);camera.lookAt(center);}
  camera.updateProjectionMatrix();return {camera,center,size};
}

try{
  const gltf=await new GLTFLoader().loadAsync(modelUrl);scene.add(gltf.scene);
  gltf.scene.traverse(o=>{if(o.isMesh&&o.material){for(const mat of (Array.isArray(o.material)?o.material:[o.material])){if(mat.map){mat.map.anisotropy=renderer.capabilities.getMaxAnisotropy();mat.map.needsUpdate=true;}}}});
  const box=new THREE.Box3().setFromObject(gltf.scene);const configured=cameraFor(box);scene.add(configured.camera);renderer.render(scene,configured.camera);await new Promise(r=>requestAnimationFrame(()=>{renderer.render(scene,configured.camera);r();}));
  let nodeCount=0,meshCount=0;gltf.scene.traverse(o=>{nodeCount++;if(o.isMesh)meshCount++;});
  const gl=renderer.getContext();const ext=gl.getExtension('WEBGL_debug_renderer_info');const gpu=ext?gl.getParameter(ext.UNMASKED_RENDERER_WEBGL):gl.getParameter(gl.RENDERER);
  const perf=performance.getEntriesByName(new URL(modelUrl,location.href).href).at(-1)||{};
  window.__QA__={status:'PASS',viewer:'three',model,view,qaId,nodeCount,meshCount,bounds:{min:box.min.toArray(),max:box.max.toArray(),size:configured.size.toArray()},webglVersion:renderer.capabilities.isWebGL2?2:1,gpu,resource:{name:perf.name||modelUrl,transferSize:perf.transferSize||0,encodedBodySize:perf.encodedBodySize||0,decodedBodySize:perf.decodedBodySize||0},assetExtras:gltf.parser.json.asset?.extras||null,renderedAt:new Date().toISOString()};
  const response=await fetch('/qa-result',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(window.__QA__)});window.__QA__.server=await response.json();status.textContent=`PASS | THREE\n${model} | ${view}\n${meshCount} meshes | ${gpu}`;
}catch(error){window.__QA__={status:'FAIL',viewer:'three',model,view,qaId,error:String(error),stack:error?.stack};status.textContent=`FAIL | THREE\n${error}`;console.error(error);}
</script>
</body>
</html>
