<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Three.js WebGL2 orbit QA</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden}
    body.light{background-color:#d7dbe0;background-image:linear-gradient(45deg,#9fa6ad 25%,transparent 25%),linear-gradient(-45deg,#9fa6ad 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#9fa6ad 75%),linear-gradient(-45deg,transparent 75%,#9fa6ad 75%)}
    body.dark{background-color:#3d4248;background-image:linear-gradient(45deg,#181c20 25%,transparent 25%),linear-gradient(-45deg,#181c20 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#181c20 75%),linear-gradient(-45deg,transparent 75%,#181c20 75%)}
    body{background-size:40px 40px;background-position:0 0,0 20px,20px -20px,-20px 0}
    canvas{display:block;width:960px;height:720px}
    #loading{position:fixed;inset:0;display:grid;place-items:center;background:#252a30;color:white;font:16px ui-monospace,monospace;z-index:5}
    #loading[hidden]{display:none!important}
  </style>
  <script type="importmap">{"imports":{"three":"../vendor/three.module.js"}}</script>
</head>
<body class="light">
<div id="loading">THREE_LOADING</div>
<script type="module">
import * as THREE from "three";
import {GLTFLoader} from "../vendor/GLTFLoader.js";

const params=new URLSearchParams(location.search);
const modelUrl=params.get("model"),initialYaw=Number(params.get("yaw")||0),initialPitch=Number(params.get("pitch")||0);
const WIDTH=960,HEIGHT=720,ASPECT=WIDTH/HEIGHT;
if(!modelUrl)throw new Error("model query parameter is required");
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true,powerPreference:"high-performance"});
renderer.setPixelRatio(1);renderer.setSize(WIDTH,HEIGHT,false);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.NoToneMapping;renderer.setClearColor(0,0);
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xffffff,0x70757b,1.0));
const key=new THREE.DirectionalLight(0xffffff,.8);key.position.set(-2.5,3.5,4);scene.add(key);
const camera=new THREE.OrthographicCamera(-1,1,1,-1,.01,10);
let center,fixedHalfWidth,fixedHalfHeight;
function orbitDirection(yaw,pitch){const y=THREE.MathUtils.degToRad(yaw),p=THREE.MathUtils.degToRad(pitch),c=Math.cos(p);return new THREE.Vector3(Math.sin(y)*c,Math.sin(p),Math.cos(y)*c).normalize()}
function fitOrbit(yaw,pitch){const dir=orbitDirection(yaw,pitch),forward=dir.clone().negate(),right=new THREE.Vector3().crossVectors(forward,new THREE.Vector3(0,1,0)).normalize(),up=new THREE.Vector3().crossVectors(right,forward).normalize();camera.position.copy(center).addScaledVector(dir,2);camera.up.copy(up);camera.lookAt(center);camera.left=-fixedHalfWidth;camera.right=fixedHalfWidth;camera.top=fixedHalfHeight;camera.bottom=-fixedHalfHeight;camera.near=.01;camera.far=10;camera.updateProjectionMatrix();camera.updateMatrixWorld(true)}
async function renderOrbit(yaw,pitch){fitOrbit(Number(yaw),Number(pitch));renderer.render(scene,camera);await new Promise(requestAnimationFrame);renderer.render(scene,camera);await new Promise(requestAnimationFrame);return {yaw:Number(yaw),pitch:Number(pitch)}}
window.qaSetOrbit=renderOrbit;
window.qaSetChecker=async kind=>{document.body.className=kind==="dark"?"dark":"light";await new Promise(requestAnimationFrame);renderer.render(scene,camera);await new Promise(requestAnimationFrame);return document.body.className};
new GLTFLoader().load(modelUrl,async gltf=>{const root=gltf.scene;scene.add(root);root.updateMatrixWorld(true);const bounds=new THREE.Box3().setFromObject(root),size=bounds.getSize(new THREE.Vector3());center=bounds.getCenter(new THREE.Vector3());fixedHalfWidth=Math.hypot(size.x,size.z)*.55;fixedHalfHeight=fixedHalfWidth/ASPECT;await renderOrbit(initialYaw,initialPitch);document.getElementById("loading").hidden=true;window.qaInfo={engine:`Three.js ${THREE.REVISION}`,webgl2:renderer.capabilities.isWebGL2,model:modelUrl,bounds:{min:bounds.min.toArray(),max:bounds.max.toArray(),size:size.toArray()},near:camera.near,far:camera.far,frozenFrustum:true,loadingOverlayHidden:true};window.qaReady=true;document.body.dataset.ready="true"},undefined,error=>{window.qaError=String(error);document.getElementById("loading").textContent=`THREE_ERROR ${error}`});
</script>
</body>
</html>
