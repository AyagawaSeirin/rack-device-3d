<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Three.js rotation stress viewer</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden}
    body{background-color:#e8ebed;background-image:linear-gradient(45deg,#c9ced2 25%,transparent 25%),linear-gradient(-45deg,#c9ced2 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#c9ced2 75%),linear-gradient(-45deg,transparent 75%,#c9ced2 75%);background-size:32px 32px;background-position:0 0,0 16px,16px -16px,-16px 0}
    body.dark{background-color:#22272a;background-image:linear-gradient(45deg,#444b4f 25%,transparent 25%),linear-gradient(-45deg,#444b4f 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#444b4f 75%),linear-gradient(-45deg,transparent 75%,#444b4f 75%)}
    canvas{display:block;width:100%;height:100%}
    #badge{position:fixed;left:10px;top:8px;padding:4px 7px;background:#111c;color:white;font:12px system-ui;z-index:2}
  </style>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
</head>
<body data-ready="false"><div id="badge">loading</div>
<script type="module">
  import * as THREE from 'three';
  import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
  import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

  const params=new URLSearchParams(location.search);
  const model=params.get('model');
  const variant=params.get('variant')||'unknown';
  if(!model) throw new Error('missing ?model= URL');
  document.body.classList.toggle('dark',params.get('bg')==='dark');
  const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true,powerPreference:'high-performance'});
  renderer.setPixelRatio(1);renderer.setSize(innerWidth,innerHeight,false);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.NoToneMapping;renderer.setClearColor(0,0);document.body.appendChild(renderer.domElement);
  const scene=new THREE.Scene();
  scene.add(new THREE.HemisphereLight(0xffffff,0x73777c,2.0));
  const key=new THREE.DirectionalLight(0xffffff,1.7);key.position.set(2,3,4);scene.add(key);
  const fill=new THREE.DirectionalLight(0xffffff,.75);fill.position.set(-3,1,-2);scene.add(fill);
  const root=(await new GLTFLoader().loadAsync(model)).scene;scene.add(root);root.updateMatrixWorld(true);
  const initialBox=new THREE.Box3().setFromObject(root),center=initialBox.getCenter(new THREE.Vector3());root.position.sub(center);root.updateMatrixWorld(true);
  const box=new THREE.Box3().setFromObject(root),size=box.getSize(new THREE.Vector3()),radius=Math.max(size.x,size.y,size.z)*1.72;
  const camera=new THREE.PerspectiveCamera(31,innerWidth/innerHeight,Math.max(.005,radius/180),radius*12);
  const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=false;controls.target.set(0,0,0);controls.minDistance=radius*.65;controls.maxDistance=radius*2.5;
  const gl=renderer.getContext();
  const materialState=[];root.traverse(object=>{if(!object.isMesh)return;for(const material of (Array.isArray(object.material)?object.material:[object.material]))materialState.push({mesh:object.name,material:material?.name,transparent:!!material?.transparent,opacity:material?.opacity,side:material?.side,depthWrite:material?.depthWrite,alphaTest:material?.alphaTest})});
  let pose={yaw:0,pitch:15,bg:params.get('bg')==='dark'?'dark':'light'};
  function draw(){controls.update();renderer.render(scene,camera)}
  async function setPose(yaw,pitch=15,bg=pose.bg){
    pose={yaw:Number(yaw),pitch:Number(pitch),bg};document.body.classList.toggle('dark',bg==='dark');
    const yr=THREE.MathUtils.degToRad(pose.yaw),pr=THREE.MathUtils.degToRad(pose.pitch),cp=Math.cos(pr);
    camera.position.set(radius*Math.sin(yr)*cp,radius*Math.sin(pr),radius*Math.cos(yr)*cp);camera.up.set(0,1,0);camera.lookAt(0,0,0);controls.target.set(0,0,0);controls.update();draw();
    await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));draw();return getState();
  }
  function getState(){return{engine:'Three.js r180',webgl:gl.getParameter(gl.VERSION),model,variant,pose,bounds:size.toArray(),camera:{position:camera.position.toArray(),near:camera.near,far:camera.far},materials:materialState,renderer:{alpha:true,outputColorSpace:String(renderer.outputColorSpace),toneMapping:renderer.toneMapping}}}
  window.__rotationQA={setPose,getState,render:draw,canvas:renderer.domElement};await setPose(0,15,pose.bg);document.body.dataset.ready='true';document.body.dataset.engine='three';document.getElementById('badge').textContent=`Three.js · ${variant}`;
  renderer.setAnimationLoop(draw);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight,false);draw()});
</script></body></html>
