<script type="module">
import * as THREE from "three";
import {GLTFLoader} from "../../node_modules/three/examples/jsm/loaders/GLTFLoader.js";
const WIDTH=1600,HEIGHT=1200,ASPECT=WIDTH/HEIGHT;
const query=new URLSearchParams(location.search);
const modelUrl=query.get("model")||"../../model/Dell-R720-3.5inch.glb";
const view=query.get("view")||"front";
const background=query.get("background")||"neutral";
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,preserveDrawingBuffer:true});
renderer.setPixelRatio(1);renderer.setSize(WIDTH,HEIGHT,false);
renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.NoToneMapping;
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(background==="dark"?0x25282b:0xdfe3e6);
scene.add(new THREE.HemisphereLight(0xffffff,0x6b7177,1.75));
const key=new THREE.DirectionalLight(0xffffff,1.18);key.position.set(-2.5,3.5,4);scene.add(key);
const fill=new THREE.DirectionalLight(0xffffff,.48);fill.position.set(3,1,-3);scene.add(fill);
const orthographic={
 front:{dir:[0,0,1],up:[0,1,0],axes:["x","y"]},rear:{dir:[0,0,-1],up:[0,1,0],axes:["x","y"]},
 left:{dir:[-1,0,0],up:[0,1,0],axes:["z","y"]},right:{dir:[1,0,0],up:[0,1,0],axes:["z","y"]},
 top:{dir:[0,1,0],up:[0,0,-1],axes:["x","z"]},bottom:{dir:[0,-1,0],up:[0,0,-1],axes:["x","z"]}
};
const perspective={"front-left":[-1,.62,1.15],"front-right":[1,.62,1.15],"rear-left":[-1,.62,-1.15],"rear-right":[1,.62,-1.15]};
function cameraFor(center,size){
 if(orthographic[view]){const s=orthographic[view],pw=size[s.axes[0]],ph=size[s.axes[1]],halfH=Math.max(ph*.58,pw/ASPECT*.58),halfW=halfH*ASPECT;
  const c=new THREE.OrthographicCamera(-halfW,halfW,halfH,-halfH,.01,20);c.position.copy(center).addScaledVector(new THREE.Vector3(...s.dir),2);c.up.set(...s.up);c.lookAt(center);c.updateProjectionMatrix();return c;}
 const c=new THREE.PerspectiveCamera(28,ASPECT,.01,20),dir=new THREE.Vector3(...(perspective[view]||perspective["front-left"])).normalize(),radius=Math.max(size.x,size.y,size.z)*.5;
 c.position.copy(center).addScaledVector(dir,radius/Math.tan(THREE.MathUtils.degToRad(14))*1.16);c.up.set(0,1,0);c.lookAt(center);c.updateProjectionMatrix();return c;
}
new GLTFLoader().load(modelUrl,gltf=>{scene.add(gltf.scene);gltf.scene.updateMatrixWorld(true);
 const bounds=new THREE.Box3().setFromObject(gltf.scene),center=bounds.getCenter(new THREE.Vector3()),size=bounds.getSize(new THREE.Vector3()),camera=cameraFor(center,size);
 let frames=0;function render(){renderer.render(scene,camera);if(++frames>=4){window.qaReady=true;document.body.dataset.ready="true";}else requestAnimationFrame(render);}requestAnimationFrame(render);
},undefined,error=>{console.error(error);window.qaError=String(error);});
</script>
