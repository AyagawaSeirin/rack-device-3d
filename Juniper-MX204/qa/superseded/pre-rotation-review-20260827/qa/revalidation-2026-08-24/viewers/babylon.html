<body><canvas id="c"></canvas><div id="proof">loading current bytes…</div>
<script>
const q=new URLSearchParams(location.search),view=q.get('view')||'front',model=q.get('model')||'/Juniper-MX204/model/Juniper-MX204.glb',expected=(q.get('expected')||'').toLowerCase(),loadId=q.get('load_id')||'unassigned',proof=document.getElementById('proof');
const defs={front:{f:[0,0,-1],u:[0,1,0]},rear:{f:[0,0,1],u:[0,1,0]},left:{f:[1,0,0],u:[0,1,0]},right:{f:[-1,0,0],u:[0,1,0]},top:{f:[0,-1,0],u:[0,0,1]},bottom:{f:[0,1,0],u:[0,0,-1]},'front-left':{e:[-1,.48,1]},'front-right':{e:[1,.48,1]},'rear-left':{e:[-1,.48,-1]},'rear-right':{e:[1,.48,-1]}};
function corners(min,max){const a=[];for(const x of [min.x,max.x])for(const y of [min.y,max.y])for(const z of [min.z,max.z])a.push(new BABYLON.Vector3(x,y,z));return a}
function cameraFor(min,max,def,engine,scene){
 const center=min.add(max).scale(.5),radius=max.subtract(min).length()*.5,c=new BABYLON.FreeCamera('camera',new BABYLON.Vector3(0,0,1),scene);
 if(def.f){const f=new BABYLON.Vector3(...def.f).normalize(),up=new BABYLON.Vector3(...def.u).normalize(),right=BABYLON.Vector3.Cross(f,up).normalize(),cs=corners(min,max),px=cs.map(p=>BABYLON.Vector3.Dot(p.subtract(center),right)),py=cs.map(p=>BABYLON.Vector3.Dot(p.subtract(center),up));let hw=(Math.max(...px)-Math.min(...px))*.55,hh=(Math.max(...py)-Math.min(...py))*.55,aspect=engine.getRenderWidth()/engine.getRenderHeight();if(hw/hh<aspect)hw=hh*aspect;else hh=hw/aspect;c.mode=BABYLON.Camera.ORTHOGRAPHIC_CAMERA;c.orthoLeft=-hw;c.orthoRight=hw;c.orthoTop=hh;c.orthoBottom=-hh;c.position=center.subtract(f.scale(2));c.upVector=up}
 else{const e=new BABYLON.Vector3(...def.e).normalize();c.fov=.61;c.position=center.add(e.scale(radius/Math.sin(c.fov/2)*1.2));c.upVector=new BABYLON.Vector3(0,1,0)}

}
function hex(buffer){return [...new Uint8Array(buffer)].map(b=>b.toString(16).padStart(2,'0')).join('')}
(async()=>{try{
 const fetchUrl=`${model}${model.includes('?')?'&':'?'}load_id=${encodeURIComponent(loadId)}&nonce=${encodeURIComponent(crypto.randomUUID())}`;
 const response=await fetch(fetchUrl,{cache:'no-store'});if(!response.ok)throw new Error(`HTTP ${response.status}`);const bytes=await response.arrayBuffer(),sha=hex(await crypto.subtle.digest('SHA-256',bytes));if(expected&&sha!==expected)throw new Error(`SHA mismatch ${sha} != ${expected}`);
 const canvas=document.getElementById('c'),engine=new BABYLON.Engine(canvas,true,{preserveDrawingBuffer:true,stencil:true,alpha:true},false);BABYLON.SceneLoader.ShowLoadingScreen=false;engine.loadingScreen={displayLoadingUI(){},hideLoadingUI(){}};

 const blobUrl=URL.createObjectURL(new Blob([bytes],{type:'model/gltf-binary'}));await BABYLON.SceneLoader.AppendAsync('',blobUrl,scene,undefined,'.glb');URL.revokeObjectURL(blobUrl);const ext=scene.getWorldExtends();scene.activeCamera=cameraFor(ext.min,ext.max,defs[view]||defs.front,engine,scene);
 const gl=engine._gl;window.__LOAD_RESULT={load_id:loadId,engine:'Babylon.js glTF loader',engine_version:BABYLON.Engine.Version,view,model_path:model,http_status:response.status,bytes:bytes.byteLength,sha256:sha,expected_sha256:expected,hash_match:sha===expected,webgl_version:engine.webGLVersion,webgl:gl.getParameter(gl.VERSION),renderer:gl.getParameter(gl.RENDERER),scene_meshes:scene.meshes.length};proof.textContent=`${loadId} | Babylon ${BABYLON.Engine.Version} | ${view} | ${sha.slice(0,16)}… | ${bytes.byteLength} B`;
 let frames=0;engine.runRenderLoop(()=>{scene.render();if(++frames===8)window.__READY=true});
}catch(error){window.__ERROR=String(error);proof.textContent=`ERROR ${String(error)}`}})();
