<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Three.js independent GLB acceptance viewer</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e9ecef;font-family:system-ui,sans-serif}
    canvas{display:block;width:100%;height:100%}
    #tag{position:fixed;left:16px;top:14px;padding:7px 10px;border-radius:6px;background:#ffffffd9;color:#17202a;font-size:13px;box-shadow:0 1px 5px #0003}
    #status{position:fixed;right:16px;top:14px;padding:7px 10px;border-radius:6px;background:#14202ce6;color:#eaffef;font:12px ui-monospace,monospace}
  </style>
</head>
<body>
  <div id="tag">Viewer B · Three.js GLTFLoader</div>
  <div id="status">loading</div>
  <script src="vendor/three.min.js"></script>
  <script src="vendor/GLTFLoader.js"></script>
  <script src="viewer.js"></script>
</body>
</html>
