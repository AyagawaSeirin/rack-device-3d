<script type="module">

const params=new URLSearchParams(location.search),modelUrl=params.get('model'),expected=params.get('expected')||'';

window.qaSetOrbit=async(yaw,pitch,bg='light')=>{currentYaw=Number(yaw);currentPitch=Number(pitch);document.body.dataset.bg=bg;const yr=THREE.MathUtils.degToRad(currentYaw),pr=THREE.MathUtils.degToRad(currentPitch),horizontal=radius*Math.cos(pr);camera.position.set(center.x+horizontal*Math.sin(yr),center.y+radius*Math.sin(pr),center.z+horizontal*Math.cos(yr));camera.up.set(0,1,0);camera.lookAt(center);camera.updateProjectionMatrix();updateHud();await renderStable();return{position:camera.position.toArray(),target:center.toArray(),near:camera.near,far:camera.far,yaw:currentYaw,pitch:currentPitch,bg};};

  const started=performance.now(),response=await fetch(modelUrl,{cache:'no-store'});if(!response.ok)throw new Error(`model HTTP ${response.status}`);const bytes=await response.arrayBuffer();actualHash=hex(await crypto.subtle.digest('SHA-256',bytes));if(expected&&actualHash!==expected)throw new Error(`hash mismatch ${actualHash} != ${expected}`);
  const gltf=await new GLTFLoader().parseAsync(bytes,'');object=gltf.scene;scene.add(object);object.updateMatrixWorld(true);
