<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>R7525 Babylon.js validation viewer</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
    canvas{display:block;width:100%;height:100%;outline:0}
    #status{position:fixed;left:10px;top:8px;padding:5px 8px;border-radius:4px;background:#10141acc;color:#fff;font:12px system-ui;z-index:3}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/babylonjs@7.44.0/babylon.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/babylonjs-loaders@7.44.0/babylonjs.loaders.min.js"></script>
</head>
<body>
  <div id="status">loading Babylon.js…</div>
  <canvas id="c" width="1200" height="800"></canvas>
  <script>
    (async()=>{
      const params=new URLSearchParams(location.search);
      const view=params.get('view')||'front-left';
      const variant=params.get('variant')==='standard'?'Dell-R7525-3.5inch.glb':'Dell-R7525-3.5inch-web.glb';
      const checker=params.get('bg');
      if(checker==='light'||checker==='dark'){
        const colors=checker==='dark'?['#17202a','#34404d']:['#f6f6f6','#d8dce0'];
        document.body.style.backgroundColor=colors[0];
        document.body.style.backgroundImage=`linear-gradient(45deg,${colors[1]} 25%,transparent 25%),linear-gradient(-45deg,${colors[1]} 25%,transparent 25%),linear-gradient(45deg,transparent 75%,${colors[1]} 75%),linear-gradient(-45deg,transparent 75%,${colors[1]} 75%)`;
        document.body.style.backgroundSize='32px 32px';
        document.body.style.backgroundPosition='0 0,0 16px,16px -16px,-16px 0';
      }
      const canvas=document.getElementById('c');
      const status=document.getElementById('status');
      const WIDTH=window.innerWidth,HEIGHT=window.innerHeight;
      const engine=new BABYLON.Engine(canvas,true,{preserveDrawingBuffer:true,stencil:true,premultipliedAlpha:false},false);
      engine.setSize(WIDTH,HEIGHT);
      const scene=new BABYLON.Scene(engine);
      // glTF and the project convention are right-handed (+Z front). Keeping
      // Babylon in that convention prevents physical left/right view swaps.
      scene.useRightHandedSystem=true;
      scene.clearColor=new BABYLON.Color4(0,0,0,0);
      const hemi=new BABYLON.HemisphericLight('hemi',new BABYLON.Vector3(0,1,0),scene); hemi.intensity=1.8; hemi.groundColor=new BABYLON.Color3(0.32,0.38,0.45);
      const key=new BABYLON.DirectionalLight('key',new BABYLON.Vector3(-1.8,-2.5,-2.2),scene); key.intensity=2.2;
      const fill=new BABYLON.DirectionalLight('fill',new BABYLON.Vector3(1.8,-0.8,1.4),scene); fill.intensity=0.8; fill.diffuse=new BABYLON.Color3(0.75,0.86,1);
      await BABYLON.SceneLoader.AppendAsync('../../model/',variant,scene);
      const ext=scene.getWorldExtends();
      const min=ext.min,max=ext.max;
      const center=min.add(max).scale(0.5);
      const size=max.subtract(min);
      const dirs={front:[0,0,1],rear:[0,0,-1],right:[1,0,0],left:[-1,0,0],top:[0,1,0],bottom:[0,-1,0],'front-left':[-1,.62,1],'front-right':[1,.62,1],'rear-left':[-1,.62,-1],'rear-right':[1,.62,-1]};
      const orthogonal=new Set(['front','rear','right','left','top','bottom']);
      const d=BABYLON.Vector3.FromArray(dirs[view]).normalize();
      const up=(view==='top'||view==='bottom')?new BABYLON.Vector3(0,0,-1):new BABYLON.Vector3(0,1,0);
      const camera=new BABYLON.FreeCamera('camera',center.add(d.scale(2)),scene);
      camera.upVector=up; camera.setTarget(center); camera.minZ=0.01; camera.maxZ=10;
      if(orthogonal.has(view)){
        camera.mode=BABYLON.Camera.ORTHOGRAPHIC_CAMERA;
        const forward=d.scale(-1);
        const right=BABYLON.Vector3.Cross(forward,up).normalize();
        const trueUp=BABYLON.Vector3.Cross(right,forward).normalize();
        let halfW=0,halfH=0;
        for(const x of [min.x,max.x]) for(const y of [min.y,max.y]) for(const z of [min.z,max.z]){
          const rel=new BABYLON.Vector3(x,y,z).subtract(center);
          halfW=Math.max(halfW,Math.abs(BABYLON.Vector3.Dot(rel,right)));
          halfH=Math.max(halfH,Math.abs(BABYLON.Vector3.Dot(rel,trueUp)));
        }
        const aspect=WIDTH/HEIGHT;
        const h=Math.max(halfH,halfW/aspect)*1.09;
        camera.orthoLeft=-h*aspect; camera.orthoRight=h*aspect; camera.orthoTop=h; camera.orthoBottom=-h;
      }else{
        camera.fov=BABYLON.Tools.ToRadians(30);
        const radius=size.length()/2;
        const distance=(radius/Math.sin(camera.fov/2))*1.18;
        camera.position=center.add(d.scale(distance)); camera.setTarget(center);
      }
      scene.activeCamera=camera;
      scene.imageProcessingConfiguration.toneMappingEnabled=false;
      engine.runRenderLoop(()=>scene.render());
      await new Promise(resolve=>{let frames=0;scene.onAfterRenderObservable.add(()=>{if(++frames===4)resolve()})});
      status.textContent=`Babylon.js loaded: ${variant} · ${view}`;
      status.style.display=params.get('labels')==='1'?'block':'none';
      window.__VIEWER_READY__=true;
      window.__VIEWER_INFO__={engine:'Babylon.js 7.44.0',variant,view,bounds:{min:min.asArray(),max:max.asArray()}};
    })().catch(err=>{document.getElementById('status').textContent=`ERROR ${err}`;window.__VIEWER_ERROR__=String(err)});
  </script>
</body>
</html>
