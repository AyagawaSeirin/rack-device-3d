<div id="loading">THREE_LOADING</div>
<script type="module">
import * as THREE from "three";
import {GLTFLoader} from "/HPE-DL360G10-3.5inch/node_modules/three/examples/jsm/loaders/GLTFLoader.js";

const params=new URLSearchParams(location.search);
const modelUrl=params.get("model");
const initialYaw=Number(params.get("yaw")||0);
const initialPitch=Number(params.get("pitch")||0);
const WIDTH=960,HEIGHT=720,ASPECT=WIDTH/HEIGHT;
if(!modelUrl) throw new Error("model query parameter is required");

const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true,powerPreference:"high-performance"});
renderer.setPixelRatio(1);renderer.setSize(WIDTH,HEIGHT,false);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.NoToneMapping;renderer.setClearColor(0,0);
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xffffff,0x697079,1.7));
const key=new THREE.DirectionalLight(0xffffff,1.15);key.position.set(-2.5,3.5,4);scene.add(key);
const fill=new THREE.DirectionalLight(0xffffff,.45);fill.position.set(3,1,-3);scene.add(fill);
const camera=new THREE.OrthographicCamera(-1,1,1,-1,.01,10);
let root,bounds,center,corners,fixedHalfWidth,fixedHalfHeight;

function orbitDirection(yaw,pitch){const y=THREE.MathUtils.degToRad(yaw),p=THREE.MathUtils.degToRad(pitch),c=Math.cos(p);return new THREE.Vector3(Math.sin(y)*c,Math.sin(p),Math.cos(y)*c).normalize()}
function fitOrbit(yaw,pitch){
  const dir=orbitDirection(yaw,pitch),forward=dir.clone().negate(),right=new THREE.Vector3().crossVectors(forward,new THREE.Vector3(0,1,0)).normalize(),up=new THREE.Vector3().crossVectors(right,forward).normalize();
  camera.position.copy(center).addScaledVector(dir,2);camera.up.copy(up);camera.lookAt(center);camera.left=-fixedHalfWidth;camera.right=fixedHalfWidth;camera.top=fixedHalfHeight;camera.bottom=-fixedHalfHeight;camera.near=.01;camera.far=10;camera.updateProjectionMatrix();camera.updateMatrixWorld(true);
}
async function renderOrbit(yaw,pitch){fitOrbit(Number(yaw),Number(pitch));renderer.render(scene,camera);await new Promise(requestAnimationFrame);renderer.render(scene,camera);await new Promise(requestAnimationFrame);return {yaw:Number(yaw),pitch:Number(pitch)}}
window.qaSetOrbit=renderOrbit;

new GLTFLoader().load(modelUrl,async gltf=>{
  root=gltf.scene;scene.add(root);root.updateMatrixWorld(true);bounds=new THREE.Box3().setFromObject(root);center=bounds.getCenter(new THREE.Vector3());corners=[];
  const size=bounds.getSize(new THREE.Vector3());fixedHalfWidth=Math.hypot(size.x,size.z)*.55;fixedHalfHeight=fixedHalfWidth/ASPECT;
  for(const x of [bounds.min.x,bounds.max.x])for(const y of [bounds.min.y,bounds.max.y])for(const z of [bounds.min.z,bounds.max.z])corners.push(new THREE.Vector3(x,y,z));
  await renderOrbit(initialYaw,initialPitch);document.getElementById("loading").hidden=true;
  window.qaInfo={engine:"Three.js 0.179.1",webgl2:renderer.capabilities.isWebGL2,model:modelUrl,bounds:{min:bounds.min.toArray(),max:bounds.max.toArray(),size:bounds.getSize(new THREE.Vector3()).toArray()},near:camera.near,far:camera.far,loadingOverlayHidden:document.getElementById("loading").hidden};window.qaReady=true;document.body.dataset.ready="true";
},undefined,error=>{window.qaError=String(error);document.getElementById("loading").textContent=`THREE_ERROR ${error}`});
