<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>HPE DL360 Gen9 8SFF — Babylon.js QA</title>
  <style>
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#dfe3e6; }
    canvas { display:block; width:100%; height:100%; touch-action:none; }
  </style>
</head>
<body>
<canvas id="renderCanvas" width="1600" height="1200"></canvas>
<script src="../../node_modules/babylonjs/babylon.js"></script>
<script src="../../node_modules/babylonjs-loaders/babylonjs.loaders.min.js"></script>
<script>
const WIDTH=1600, HEIGHT=1200, ASPECT=WIDTH/HEIGHT;
const query=new URLSearchParams(location.search);
const modelUrl=query.get("model")||"../../model/HPE-DL360G9-2.5inch.glb";
const view=query.get("view")||"front";
const background=query.get("background")||"neutral";
const canvas=document.getElementById("renderCanvas");
const engine=new BABYLON.Engine(canvas,true,{preserveDrawingBuffer:true,stencil:true},true); engine.setSize(WIDTH,HEIGHT);
BABYLON.SceneLoader.ShowLoadingScreen=false;
const scene=new BABYLON.Scene(engine);
scene.clearColor=background==="dark"?new BABYLON.Color4(.145,.157,.169,1):new BABYLON.Color4(.8745,.8902,.9020,1);
scene.imageProcessingConfiguration.toneMappingEnabled=false;
scene.imageProcessingConfiguration.exposure=1; scene.imageProcessingConfiguration.contrast=1;
const hemi=new BABYLON.HemisphericLight("hemi",new BABYLON.Vector3(-.4,1,.6),scene); hemi.intensity=1.48; hemi.groundColor=new BABYLON.Color3(.45,.48,.50);
const key=new BABYLON.DirectionalLight("key",new BABYLON.Vector3(.4,-.8,-.7),scene); key.intensity=1.12;
const fill=new BABYLON.DirectionalLight("fill",new BABYLON.Vector3(-.7,-.2,.7),scene); fill.intensity=.50;

const orthographic={
 front:{dir:[0,0,1],up:[0,1,0],axes:["x","y"]}, rear:{dir:[0,0,-1],up:[0,1,0],axes:["x","y"]},
 left:{dir:[-1,0,0],up:[0,1,0],axes:["z","y"]}, right:{dir:[1,0,0],up:[0,1,0],axes:["z","y"]},
 top:{dir:[0,1,0],up:[0,0,-1],axes:["x","z"]}, bottom:{dir:[0,-1,0],up:[0,0,-1],axes:["x","z"]}
};
const perspective={"front-left":[-1,.62,1.15],"front-right":[1,.62,1.15],"rear-left":[-1,.62,-1.15],"rear-right":[1,.62,-1.15]};
const vector=a=>new BABYLON.Vector3(a[0],a[1],a[2]);
function cameraFor(center,size){
 const camera=new BABYLON.FreeCamera("qa-camera",new BABYLON.Vector3(0,0,2),scene); camera.minZ=.01; camera.maxZ=20;
 if(orthographic[view]){const spec=orthographic[view],pw=size[spec.axes[0]],ph=size[spec.axes[1]],halfH=Math.max(ph*.58,pw/ASPECT*.58),halfW=halfH*ASPECT;
  camera.mode=BABYLON.Camera.ORTHOGRAPHIC_CAMERA;camera.orthoLeft=-halfW;camera.orthoRight=halfW;camera.orthoTop=halfH;camera.orthoBottom=-halfH;
  camera.position=center.add(vector(spec.dir).scale(2));camera.upVector=vector(spec.up);
 }else{const dir=vector(perspective[view]||perspective["front-left"]).normalize(),radius=Math.max(size.x,size.y,size.z)*.5,fov=28*Math.PI/180;
  camera.fov=fov;camera.position=center.add(dir.scale(radius/Math.tan(fov/2)*1.18));camera.upVector=new BABYLON.Vector3(0,1,0);}
 camera.setTarget(center);return camera;
}
BABYLON.SceneLoader.AppendAsync("",modelUrl,scene).then(()=>{
 const ext=scene.getWorldExtends(mesh=>mesh.isEnabled()&&mesh.getTotalVertices()>0),center=ext.min.add(ext.max).scale(.5),size=ext.max.subtract(ext.min);
 scene.activeCamera=cameraFor(center,size);
 engine.hideLoadingUI();
 let completedFrames=0;
 engine.runRenderLoop(()=>{
  scene.render();
  if(window.qaReady!==true&&++completedFrames>=8){window.qaReady=true;document.body.dataset.ready="true";}
 });
}).catch(error=>{console.error(error);window.qaError=String(error);});
</script>
</body>
</html>
